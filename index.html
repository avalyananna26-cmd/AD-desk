const SAMPLE = "Title: THE SPARE KEY\nWritten by: AD Desk sample script\nDraft: White, October 2026\n\n\nFADE IN:\n\nINT. DAVIT'S APARTMENT - BEDROOM - DAWN\n\nGrey light through thin curtains. An ALARM CLOCK blinks 06:00, silent. Its cord hangs unplugged.\n\nDAVIT (34), unshaven, asleep face-down in yesterday's shirt. A garment bag with a dark SUIT hangs on the wardrobe door. Pinned to it, a sticky note: \"RINGS!!! 10:00 - DON'T BE DAVIT.\"\n\nHis PHONE buzzes on the nightstand. And again. He slaps it to the floor.\n\nDAVIT\n(into the pillow)\nFive more minutes.\n\nINT. DAVIT'S APARTMENT - KITCHEN - MORNING\n\nDavit, half awake, spoons coffee into a JEZVE and sets it on the gas stove. His phone rings. ARAM calling. He answers on speaker.\n\nAcross town, ARAM (35) stands in his tiny barbershop, a towel over one shoulder, a half-shaved CUSTOMER (60s) frozen in the chair behind him.\n\nARAM\nTell me you're dressed.\n\nDAVIT\nI'm making coffee. That's step one of dressed.\n\nARAM\nYour sister has called me four times. Four, Davit.\n\nThe coffee foams over and hisses on the stove. Davit swears, kills the gas, and hangs up on Aram mid-sentence.\n\nHe runs to the bedroom, rips open the garment bag and pulls on the suit, tie still around his neck untied. He grabs his car keys and the RING BOX from the nightstand, then puts the ring box down to find his other shoe. He finds the shoe. He does not pick the ring box up again.\n\nHe takes the stairs three at a time, out through the courtyard where an OLD WOMAN is feeding pigeons, and jumps into his battered white NIVA. It starts on the third try.\n\nAt the first red light on Mashtots Avenue he pats his jacket. Left pocket. Right pocket. Inside pocket. Nothing.\n\nDAVIT\nNo. No, no, no.\n\nHe makes an illegal U-turn. A TRAFFIC POLICEMAN blows his whistle. Davit waves an apology and floors it.\n\nINT. ARAM'S BARBERSHOP - DAY\n\nSmall, warm, full. Three WAITING CUSTOMERS on a bench read newspapers. A radio plays old Armenian estrada.\n\nAram finishes the half-shaved customer with one long stroke of the STRAIGHT RAZOR, wipes his hands and tears off his apron.\n\nARAM\n(to the room)\nFamily emergency. Twenty minutes.\n\nWAITING CUSTOMER\nYou said that last Tuesday.\n\nARAM\nIt was also a family emergency last Tuesday.\n\nHe grabs his jacket and a small GIFT BOX wrapped in gold paper and walks out.\n\nEXT. CHURCH COURTYARD - DAY\n\nAn old stone church. WEDDING GUESTS (40) in their best clothes mill around. A DUDUK PLAYER warms up near the gate. Two KIDS chase each other between the guests.\n\nNARINE (60), Davit's mother, elegant and furious, checks her watch.\n\nNARINE\nIf he doesn't come, I will kill him in front of God.\n\nAram arrives, out of breath, gift box in hand.\n\nARAM\nHe's on his way.\n\nNARINE\nWhere is he exactly?\n\nARAM\n(beat)\nOn his way.\n\nINT. DAVIT'S NIVA - MOVING - DAY\n\nDavit drives with one hand and holds the phone with the other. Sweat on his forehead.\n\nINTERCUT WITH:\n\nINT. CHURCH - BRIDAL ROOM - DAY\n\nLILIT (29), in her wedding dress, sits very still while a MAKEUP ARTIST fixes her eyeliner. She has the phone pressed to her ear.\n\nLILIT\nDavit. Do you have the rings?\n\nDAVIT\nI have... a plan for the rings.\n\nLILIT\nDavit.\n\nDAVIT\nThirty minutes. I promise.\n\nLilit hangs up. The makeup artist freezes, brush in mid-air.\n\nEXT. DAVIT'S BUILDING - ENTRANCE - DAY\n\nDavit sprints from the parked Niva to the heavy metal door of the building. He tries the handle. Locked. He searches his pockets. Car keys. No house keys.\n\nHe presses his forehead against the door. Then he looks down at the cracked clay FLOWERPOT with a dead geranium beside the steps, and remembers.\n\nSummer, twenty years ago. Their grandmother's yard in the village of Garni. Apricot trees heavy with fruit. YOUNG LILIT (8), barefoot and serious, buries a KEY under a flowerpot while YOUNG DAVIT (12) watches from the tree.\n\nYOUNG LILIT\nFor when you lose yours. Because you will.\n\nBack at the entrance, Davit tips the flowerpot over. Under it, a rusted SPARE KEY. He laughs out loud.\n\nINT. CHURCH - DAY\n\nCandles, incense, the low voice of the PRIEST. Lilit and her groom, SAMVEL (31), stand before the altar. The GUESTS fill the pews. Narine, in the front row, stares at the door.\n\nThe door bangs open. Davit, tie undone, one shoe untied, holds the ring box above his head like a trophy.\n\nEvery head turns. The priest pauses.\n\nDavit walks the aisle trying very hard to look calm. He hands the box to Samvel. Lilit doesn't look at him.\n\nLILIT\n(whispering, not turning)\nGrandma's flowerpot?\n\nDAVIT\n(whispering)\nGrandma's flowerpot.\n\nA tiny smile from Lilit.\n\nEXT. CHURCH COURTYARD - NIGHT\n\nString lights between the trees. A small band plays. The GUESTS dance in a circle, arms linked. Narine dances with Aram.\n\nDavit sits alone on the stone steps, jacket off, holding the rusty spare key. Lilit, barefoot now, sits down beside him.\n\nLILIT\nKeep it. You'll need it again.\n\nShe takes his hand and pulls him into the circle.\n\nFADE OUT.\n\nTHE END\n";
const SAMPLE2 = "Title: THE LAST TRAM\nWritten by: AD Desk sample script\nDraft: White, October 2026\n\n\nFADE IN:\n\nEXT. KANAKER TRAM DEPOT - NIGHT\n\nJanuary. SNOW falls in slow, heavy flakes over a yard of rusting rails. Under a single sodium lamp stands the old TRAM, number 7, red and cream paint peeling, its windows fogged from the inside.\n\nA STRAY DOG sleeps under the front step of the tram. Somewhere a radio plays the news: the city's tram system closes tonight, after seventy years.\n\nINT. KANAKER TRAM DEPOT - OFFICE - NIGHT\n\nA cramped office. Calendars from 1991, 1997 and 2003 still hang on the wall. An electric heater glows orange.\n\nGEVORG (60), the depot manager, heavy coat over his suit, stamps a final logbook. ANUSH (58), small, sharp-eyed, in a driver's uniform two sizes too big, stands at the door with her lunch in a plastic bag.\n\nGEVORG\nLast run leaves at eleven. Route seven, Kanaker to the bridge and back. Then we lock the gate and that's it.\n\nANUSH\nThirty-four years and you give me a logbook to sign.\n\nGEVORG\nYou want a speech? I can do a speech.\n\nANUSH\nGod, no.\n\nThe office PHONE rings. Gevorg answers.\n\nAcross the city, in a newsroom full of cigarette smoke, TATEV (32), a reporter with a notebook wedged under her chin, types with two fingers while she talks.\n\nTATEV\nIs this the depot? I'm from Aravot. We want someone on the last tram tonight. Photos, a story, the driver's name.\n\nGEVORG\n(covering the receiver, to Anush)\nThe newspaper wants you.\n\nANUSH\nTell them I'm dead.\n\nGEVORG\n(into the phone)\nShe says come at eleven.\n\nAnush glares at him. He hangs up and smiles for the first time.\n\nINT. KANAKER TRAM DEPOT - LOCKER ROOM - NIGHT\n\nRows of dented metal lockers, most of them already empty, their doors hanging open. A single bulb.\n\nSIRANUSH (61), a retired conductor in a fur hat and too much lipstick, sits on the bench waiting. She has brought a cake in a cardboard box.\n\nANUSH\nSiranush. You retired in 1999.\n\nSIRANUSH\nAnd I came back for the funeral. Sit.\n\nAnush sits. Siranush opens the box. The cake has a tram drawn on it in green icing. It looks more like a crocodile.\n\nSIRANUSH (CONT'D)\nMy granddaughter made it. Don't say anything.\n\nANUSH\nIt's beautiful. It has teeth.\n\nThey laugh. Siranush pulls an old conductor's TICKET PUNCH out of her coat pocket and presses it into Anush's hand.\n\nSIRANUSH\nPunch one ticket for me tonight. Just one.\n\nAnush opens her locker. Inside, taped to the door, a faded photograph of a young woman standing proudly beside a brand new tram. She takes the photo down and puts it in her breast pocket.\n\nINT. ARAVOT NEWSROOM - NIGHT\n\nDesks buried in paper. A TV on the wall shows the evening news. A few tired JOURNALISTS (6) smoke at their computers.\n\nTatev hangs up the phone and grabs her coat. Her editor, VARDAN (55), feet on his desk, doesn't look up from his crossword.\n\nVARDAN\nFive hundred words. And a photo where somebody is crying.\n\nTATEV\nWhat if nobody cries?\n\nVARDAN\nThen make Armen cry. He cries at weddings.\n\nARMEN (40), the paper's photographer, looks up from a plate of cold khorovats, offended.\n\nARMEN\nThat was one time.\n\nINT. ANUSH'S APARTMENT - LIVING ROOM - NIGHT\n\nA Soviet-era flat. Carpets on the walls, a TV with no sound, photographs of trams everywhere.\n\nLEVON (19), Anush's grandson, headphones on, wakes up on the sofa. He reads a note taped to the TV screen: \"LAST RUN TONIGHT. 11:00. YOU PROMISED.\"\n\nHe checks his PHONE. 10:41.\n\nLEVON\nNo, no, no.\n\nHe grabs his jacket and runs down the dark stairwell, four floors, the timer light clicking off halfway so he finishes in darkness and nearly falls. He bursts out into the courtyard where two OLD MEN are playing backgammon under a plastic sheet in the snow.\n\nOLD MAN\nWhere's the fire?\n\nLEVON\nGrandma's tram!\n\nHe sprints to the street, waves down a battered yellow TAXI and throws himself into the back seat.\n\nEXT. KANAKER TRAM DEPOT - NIGHT\n\nEleven o'clock. Anush climbs into the driver's cab of Tram No. 7. The stray dog wakes, stretches, and climbs aboard after her as if it does this every night.\n\nGevorg pulls the yard lever. The OVERHEAD WIRE sparks blue in the snow.\n\nGEVORG\nGo on. Before I change my mind.\n\nThe tram rolls out of the gate.\n\nINT. TRAM NO. 7 - MOVING - NIGHT\n\nWooden seats, brass handles, frost on the windows. Anush drives standing up, the way she always has.\n\nAt the first stop, PASSENGERS (12) climb aboard: night-shift workers, a couple in wedding clothes, an old man with a cage holding a CANARY. They have all heard. Nobody pays the fare. Nobody is asked to.\n\nEXT. REPUBLIC SQUARE - TRAM STOP - NIGHT\n\nThe fountains are frozen. Tatev waits at the stop with Armen, weighed down by two CAMERAS and a flash bag. He photographs the tram as it arrives, flash popping in the snow.\n\nTATEV\nMrs. Anush? Tatev, from Aravot. Can we ride with you?\n\nANUSH\nThe tram is free tonight. Even for journalists.\n\nINT. TRAM NO. 7 - MOVING - NIGHT\n\nTatev stands beside the cab, notebook open. Armen shoots the passengers, who wave and pose.\n\nTATEV\nDo you remember your first day?\n\nAnush watches the rails for a long moment. Then she smiles.\n\nSummer, 1990. The same tram, new paint, gleaming. YOUNG ANUSH (24), hair in a scarf, terrified, holds the controller with both hands. Beside her, her instructor, old HAKOB (65), smokes and pretends not to watch.\n\nHAKOB\nDon't strangle it. It's a tram, not a husband.\n\nYoung Anush laughs and the tram jerks forward. A crowd of PASSENGERS, summer dresses and newspapers, sways and grumbles.\n\nBack in the present, Anush is laughing too. Tatev writes fast.\n\nANUSH\nHe said the tram knows the way. You just have to not argue with it.\n\nINT. TAXI - MOVING - NIGHT\n\nThe TAXI DRIVER (50s), a man with a huge moustache, listens to loud rabiz music. Levon leans forward between the seats.\n\nLEVON\nCan you go faster?\n\nTAXI DRIVER\nIn this snow? I have children.\n\nLevon calls Anush.\n\nINTERCUT WITH:\n\nINT. TRAM NO. 7 - DRIVER'S CAB - MOVING - NIGHT\n\nAnush answers with one hand, the phone pressed to her shoulder.\n\nANUSH\nWhere are you?\n\nLEVON\nIn a taxi. Where are you?\n\nANUSH\nWhere do you think? On the rails.\n\nLEVON\nWait for me at the bridge. Please.\n\nANUSH\nA tram does not wait. That is the whole point of a tram.\n\nShe hangs up. But she glances at her watch.\n\nEXT. BAGHRAMYAN AVENUE - NIGHT\n\nThe taxi crawls behind a municipal SNOWPLOW, orange lights spinning, blade scraping the asphalt. There is no way around it.\n\nThe taxi driver leans on the horn. The snowplow driver leans out of his window and makes a gesture that needs no translation.\n\nINT. TAXI - MOVING - CONTINUOUS\n\nLevon stares at the snowplow, then at the meter, then at his phone. 11:24.\n\nLEVON\nHow far is the bridge from here?\n\nTAXI DRIVER\nOn foot? Ten minutes. If you are an athlete.\n\nLEVON\nI'm not.\n\nTAXI DRIVER\nThen fifteen.\n\nHe turns the music up. Levon closes his eyes.\n\nINT. TRAM NO. 7 - MOVING - NIGHT\n\nThe wedding couple, NAIRA (26) in a white dress under a man's coat and DAVO (28) in a suit, edge up to the driver's cab.\n\nDAVO\nExcuse me. Can you stop at the Cascade? Just for one minute.\n\nANUSH\nThis is a tram, not a taxi.\n\nNAIRA\nWe had our first date on this tram. Route seven. He spilled tan on my shoes.\n\nAnush looks at them in the mirror. Then at Tatev, who is writing all of this down.\n\nANUSH\nOne minute.\n\nEXT. CASCADE - TRAM STOP - NIGHT\n\nThe tram stops at the foot of the Cascade, the giant white staircase glowing under the snow. Naira and Davo jump out and kiss in the falling snow while the whole tram watches through the windows.\n\nThe passengers applaud. The old man with the canary whistles. Armen photographs them through the glass.\n\nAnush rings the bell twice. The couple runs back in, breathless and laughing.\n\nINT. TRAM NO. 7 - MOVING - NIGHT\n\nA DRUNK MAN (45) in a leather jacket stands up from the back seat and sways toward the front.\n\nDRUNK MAN\nWhy are we stopping for kissing? I have to get home!\n\nHe loses his balance on the next curve, grabs a strap, misses, and falls flat into the aisle. The canary screams. Everybody helps him up. He sits down again, embarrassed, and offers the wedding couple a cigarette as an apology.\n\nEXT. MASHTOTS AVENUE - NIGHT\n\nThe tram slows. A black JEEP is parked across the rails, its hazard lights blinking. No driver.\n\nAnush leans on the BELL. It rings out across the empty avenue. Nothing.\n\nA POLICE CAR pulls up. A young POLICE OFFICER (25) gets out, looks at the jeep, looks at the tram, looks at the passengers pressed against the windows.\n\nPOLICE OFFICER\nWhose is this?\n\nPASSENGER\nNobody's! Push it!\n\nThe passengers pour out of the tram. Night-shift workers, the wedding couple, the old man with the canary cage, even Tatev. Together, laughing and slipping in the snow, they push the jeep off the rails. Armen photographs everything.\n\nThe officer shrugs and helps.\n\nBEGIN MONTAGE - THE LAST ROUTE\n\n-- The tram passes the Opera House. A COUPLE dancing on the steps stops and waves.\n\n-- At the Blue Mosque, a SHOPKEEPER closing his shutters takes off his hat as it passes.\n\n-- On Abovyan Street, a group of STUDENTS runs alongside the tram, banging on the windows and cheering.\n\n-- Inside, the passengers sing an old Soviet song about a tram. Badly. Tatev sings along.\n\nEND MONTAGE\n\nEXT. KIEVYAN BRIDGE - NIGHT\n\nThe taxi skids to a stop at the end of the bridge. Levon jumps out without paying.\n\nTAXI DRIVER\nHey!\n\nLevon sees the tram already crossing the bridge, its lights blurry through the snow. He runs. He runs along the rails, slipping, falling once, getting up. The tram is slowing for the curve.\n\nHe catches the rear handrail, swings himself onto the back step and clings there, breathing hard, snow in his hair.\n\nINT. TRAM NO. 7 - MOVING - NIGHT\n\nLevon makes his way through the passengers to the cab. Anush sees him in the mirror. She does not turn around.\n\nANUSH\nYou're late.\n\nLEVON\nYou didn't wait.\n\nANUSH\n(still not turning)\nI drove slower. That's the same thing.\n\nHe stands beside her. She steps aside and puts his hand on the controller, her hand over his.\n\nANUSH (CONT'D)\nDon't strangle it.\n\nEXT. KANAKER TERMINUS - NIGHT\n\nThe end of the line. A crowd of NEIGHBORS (30) waits in the snow with candles and thermoses of coffee. A DUDUK PLAYER stands on an upturned crate and plays as the tram arrives.\n\nThe stray dog jumps off first and runs to the crowd like a celebrity.\n\nGevorg's old LADA pulls up behind the crowd. He gets out, still in his suit, and pushes his way to the front.\n\nGEVORG\nAll right. Everybody. Quiet.\n\nThe duduk stops. The crowd turns.\n\nGEVORG (CONT'D)\nI said I would not make a speech.\n(beat)\nI lied.\n\nHe takes a folded sheet of paper from his pocket, looks at it, and puts it back.\n\nGEVORG (CONT'D)\nSeventy years. Two wars, one earthquake, no electricity for three winters. And this tram never stopped. Not once. Until tonight.\n\nSomebody in the crowd starts crying. Armen raises his camera, then lowers it and wipes his own eyes. Tatev sees him and smiles.\n\nGEVORG (CONT'D)\nAnush. Come down. Let them see you.\n\nAnush stays in the cab. She shakes her head. Then Siranush appears at the tram door with her fur hat and her crocodile cake and simply holds out her hand. Anush takes it and steps down into the snow.\n\nThe crowd cheers. Anush takes the ticket punch from her pocket, takes the last paper TICKET from Siranush's hand, and punches it.\n\nINT. TRAM NO. 7 - CONTINUOUS\n\nAnush pulls the bell cord one last time. Then she reaches up and pulls the pole down from the overhead wire.\n\nThe lights go out. The heater goes quiet. In the dark, nobody moves.\n\nThen, outside, the neighbors begin to clap.\n\nEXT. KANAKER TRAM DEPOT - DAWN\n\nThe snow has stopped. Gevorg chains the gate shut and hangs a padlock on it. He stays there, his hand on the chain, for longer than he needs to.\n\nINT. ANUSH'S APARTMENT - KITCHEN - MORNING\n\nSunlight on the frosted window. Anush makes coffee in a JEZVE. Levon sleeps at the table, head on his arms.\n\nOn the table lies the brass TRAM BELL, unscrewed from the cab, and a copy of Aravot. On the front page: Armen's photo of a crowd pushing a jeep off the rails in the snow. The headline reads: \"THE CITY PUSHED.\"\n\nAnush pours two cups. She rings the bell once, very softly. Levon wakes.\n\nLEVON\nIs it a working day?\n\nANUSH\nFor you, it is. Go find a job.\n\nShe sits down across from him, and for the first time in thirty-four years, she has nowhere to be.\n\nFADE OUT.\n\nTHE END\n";

const IN_CLAUDE = () => !!window.claude?.use;
async function saveFile(filename, data, type='text/html'){
  let dl = null; try{ dl = IN_CLAUDE() ? await window.claude.use('downloads') : null; }catch(_){}
  if(dl){ await dl.save({filename, data}); return; }
  const url = URL.createObjectURL(new Blob([data], {type: type+';charset=utf-8'}));
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

/* ---------- storage: the viewer's own Claude space, or this browser ---------- */
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const vid = n => 'v' + String(n).padStart(3,'0');
function cloudStore(db, uid){
  const col = db.collection('data/users/' + uid);
  const vcol = id => col.doc(id).collection('versions');
  const wref = (id,n) => vcol(id).doc(vid(n)).collection('work').doc('breakdown');
  return {
    kind:'cloud',
    watchScripts(cb, err){ return col.onSnapshot(snap=>cb(snap.docs.map(d=>({id:d.id, ...d.data()})).filter(s=>s.kind==='script').sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))), err); },
    async createScript(meta, version){ const id=newId('s'); await vcol(id).doc(vid(version.n)).set(version); await col.doc(id).set({...meta, kind:'script'}); return id; },
    async updateScript(id, patch){ await col.doc(id).update(patch); },
    async deleteScript(id){ for(const k of ['cast','crew','locs','sheets']){ try{ const s=await col.doc(id).collection(k).get(); for(const d of s.docs) await col.doc(id).collection(k).doc(d.id).delete(); }catch(_){} } const vs = await vcol(id).get(); for(const d of vs.docs){ await vcol(id).doc(d.id).collection('work').doc('breakdown').delete().catch(()=>{}); await vcol(id).doc(d.id).delete(); } await col.doc(id).delete(); },
    async listVersions(id){ const s = await vcol(id).get(); return s.docs.map(d=>d.data()).sort((a,b)=>a.n-b.n); },
    async addVersion(id, v){ await vcol(id).doc(vid(v.n)).set(v); },
    async getWork(id, n){ const s = await wref(id,n).get(); return s.exists ? s.data() : null; },
    async saveWork(id, n, w){ await wref(id,n).set(w); },
    async listKind(id, kind){ const s = await col.doc(id).collection(kind).get(); return s.docs.map(d=>({...d.data(), id:d.id})); },
    async putKind(id, kind, key, data){ await col.doc(id).collection(kind).doc(key).set(data); },
    async delKind(id, kind, key){ await col.doc(id).collection(kind).doc(key).delete(); },
    async getProfile(){ const s = await col.doc('profile').get(); return s.exists ? s.data() : null; },
    async setProfile(p){ await col.doc('profile').set({...p, kind:'profile'}); },
  };
}
function localStore(){
  const K='eighths-lib-v1'; let mem=null; const subs=new Set();
  const read=()=>{ if(mem) return mem; try{ mem=JSON.parse(localStorage.getItem(K)); }catch(e){} if(!mem||!mem.scripts) mem={scripts:{}}; return mem; };
  const persist=()=>{ try{ localStorage.setItem(K, JSON.stringify(mem)); }catch(e){} };
  const list=()=>Object.entries(read().scripts).map(([id,s])=>({id, ...s.meta})).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  const notify=()=>{ persist(); const l=list(); subs.forEach(f=>f(l)); };
  return {
    kind:'local',
    watchScripts(cb){ subs.add(cb); cb(list()); return ()=>subs.delete(cb); },
    async createScript(meta, version){ const id=newId('s'); read().scripts[id]={meta:{...meta}, versions:{[version.n]:version}, work:{}}; notify(); return id; },
    async updateScript(id, patch){ Object.assign(read().scripts[id].meta, patch); notify(); },
    async deleteScript(id){ delete read().scripts[id]; notify(); },
    async listVersions(id){ return Object.values(read().scripts[id]?.versions||{}).map(v=>({...v})).sort((a,b)=>a.n-b.n); },
    async addVersion(id, v){ read().scripts[id].versions[v.n]=v; persist(); },
    async getWork(id, n){ const w = read().scripts[id]?.work[n]; return w ? structuredClone(w) : null; },
    async saveWork(id, n, w){ const s=read().scripts[id]; if(!s) return; s.work[n]=structuredClone(w); persist(); },
    async listKind(id, kind){ return Object.values(read().scripts[id]?.items?.[kind]||{}).map(x=>structuredClone(x)); },
    async putKind(id, kind, key, data){ const s=read().scripts[id]; if(!s) return; ((s.items ||= {})[kind] ||= {})[key]=structuredClone({...data, id:key}); persist(); },
    async delKind(id, kind, key){ const s=read().scripts[id]; if(s?.items?.[kind]) delete s.items[kind][key]; persist(); },
    async getProfile(){ return read().profile ? {...read().profile} : null; },
    async setProfile(p){ read().profile = {...p}; persist(); },
  };
}
let lastSaved='', saveT=null;
function save(){
  if(app.screen!=='workspace' || app.loading || RO() || !store) return;
  const w = workOf(state); const s = JSON.stringify(w);
  if(s===lastSaved) return;
  clearTimeout(saveT); const sid=app.sid, n=app.vn;
  saveT = setTimeout(async()=>{
    try{ await store.saveWork(sid, n, w); lastSaved = s; }
    catch(e){ ui.msg={type:'err', html:'Your breakdown couldn’t be saved. Check your connection; the next change will try again.'}; renderNotice(); }
  }, 600);
}

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const norm = s => s.replace(/\r\n?/g,'\n').trim();
const titleCase = s => s.toLowerCase().replace(/(^|\s)\S/g, m=>m.toUpperCase()).replace(/'S\b/g,"'s");
function fmt8(n){ const w=Math.floor(n/8), r=n%8; if(!w) return r+'/8'; return r? w+' '+r+'/8' : String(w); }
function hasWord(hay, needle){ return new RegExp('(?<![\\w])'+reEsc(needle)+'(?![\\w])','i').test(hay); }
const when = t => t ? new Date(t).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
const icon = {

/* ---------- parsing ---------- */
const HEAD_TEST = /^(?:\d+[A-Z]?\s+)?(INT\.?\s*\/\s*EXT|EXT\.?\s*\/\s*INT|I\/E|INT|EXT|EST)[.\s]/i;
function parseHeading(raw){
  let s = raw.trim().replace(/^\d+[A-Z]?\s+/,'').replace(/\s+\d+[A-Z]?$/,'');
  const flags=[]; let ie='INT', rest=s;
  const m = s.match(/^(INT\.?\s*\/\s*EXT\.?|EXT\.?\s*\/\s*INT\.?|I\/E\.?|INT\.?|EXT\.?|EST\.?)\s+(.*)$/i);
  if(m){ const t=m[1].toUpperCase().replace(/[\s.]/g,''); ie = t.includes('/') ? 'I/E' : (t.startsWith('EXT')||t==='EST' ? 'EXT' : 'INT'); rest=m[2]; }
  rest = rest.replace(/\(([^)]+)\)/g,(_,g)=>{ flags.push(g.trim().toUpperCase()); return ''; }).trim();
  const parts = rest.split(/\s+[-–—]+\s+|\s*[–—]\s*/).map(p=>p.trim()).filter(Boolean).map(p=>p.toUpperCase());
  let time='';
  while(parts.length>1){
    const last = parts[parts.length-1];
    if(FLAG_WORDS.has(last)){ flags.unshift(last); parts.pop(); }
    else if(TIME_WORDS.has(last) && !time){ time=last; parts.pop(); }
    else break;
  }
  const set = parts.join(' - ') || 'UNKNOWN';
  const dn = INHERIT.has(time) ? null : (NIGHT_SET.has(time) ? 'N' : 'D');
  return {ie, set, locKey: parts[0]||set, time, flags, dn};
}
function isTrans(line){
  return /^(FADE (IN|OUT)[:.]?|FADE TO BLACK\.?|CUT TO:|SMASH CUT TO:|MATCH CUT TO:|DISSOLVE TO:|INTERCUT WITH:|BACK TO SCENE:?|THE END\.?|END\.?)$/i.test(line) || (/TO:$/.test(line) && line===line.toUpperCase());
}
function isCue(line, blockLen){
  if(blockLen<2) return false;
  const base = line.replace(/\(.*?\)/g,'').trim();
  return base.length>0 && base.length<38 && /[A-Z]/.test(base) && !/[a-z]/.test(base) && !/[:!?]$/.test(base);
}
const parseCache = new Map();
function parseScript(text){
  if(parseCache.has(text)) return parseCache.get(text);
  const lines = norm(text).split('\n');
  const blocks=[]; let cur=[];
  for(const l of lines){ const t=l.trim(); if(!t){ if(cur.length){blocks.push(cur);cur=[];} } else cur.push(t); }
  if(cur.length) blocks.push(cur);
  let title='', author=''; const scenes=[]; let sc=null; let pendingIC=null; let base=0;
  for(let block of blocks){
    if(HEAD_TEST.test(block[0])){
      base++;
      sc = {base, heading:block[0].replace(/^\d+[A-Z]?\s+/,'').replace(/\s+\d+[A-Z]?$/,''), h:parseHeading(block[0]), els:[], intercutWith:null};
      if(pendingIC){ sc.intercutWith = pendingIC.base; pendingIC.intercutWith = base; pendingIC=null; }
      scenes.push(sc);
      block = block.slice(1);
      if(!block.length) continue;
    }
    if(!sc){ for(const l of block){ const m=l.match(/^Title:\s*(.+)$/i); if(m) title=m[1].trim(); const a=l.match(/^(Authors?|Written by):\s*(.+)$/i); if(a && (!author || /^author/i.test(a[1]))) author=a[2].trim(); } continue; }
    if(block.length===1 && isTrans(block[0])){
      const ic = /^INTERCUT/i.test(block[0]);
      sc.els.push({type:'trans', text:block[0], ic});
      if(ic) pendingIC = sc;
      continue;
    }
    if(isCue(block[0], block.length)){
      const name = block[0].replace(/\(.*?\)/g,'').replace(/\^$/,'').trim().toUpperCase();
      sc.els.push({type:'cue', text:block[0], name});
      let dlg=[];
      const flush=()=>{ if(dlg.length){ sc.els.push({type:'dialogue', text:dlg.join(' ')}); dlg=[]; } };
      for(const l of block.slice(1)){ if(/^\(.*\)$/.test(l)){ flush(); sc.els.push({type:'paren', text:l}); } else dlg.push(l); }
      flush();
      continue;
    }
    sc.els.push({type:'action', text:block.join(' ')});
  }
  const castNames = new Set();
  for(const s of scenes) for(const e of s.els) if(e.type==='cue') castNames.add(e.name);
  for(const s of scenes) for(const e of s.els) if(e.type==='action')
    for(const ph of capsPhrases(e.text)) if(ph.paren && /^\d+s?$/i.test(ph.paren.trim()) && !EXTRA_WORDS.has(ph.text.split(/\s+/).pop()) && !(/S$/.test(ph.text) && /^\d+$/.test(ph.paren.trim()))) castNames.add(ph.text);
  const out = {title, author, scenes, castNames};
  if(parseCache.size>12) parseCache.clear();
  parseCache.set(text, out);
  return out;
}
function capsPhrases(text){
  if(/^(BEGIN|END)\s+(MONTAGE|SERIES OF SHOTS)|^(SERIES OF SHOTS|END SERIES|MONTAGE)\b/i.test(text.trim())) return [];
  const t = text.replace(/"[^"]*"|“[^”]*”/g, m=>' '.repeat(m.length));
  const re = /(?<![\w'’])[A-Z][A-Z0-9'’\-]*[A-Z](?:\s+[A-Z][A-Z0-9'’\-]*[A-Z])*(?![\w'’])(?:\s*\(([^)]*)\))?/g;
  const out=[]; let m;
  while((m=re.exec(t))){
    const txt = m[0].replace(/\s*\([^)]*\)$/,'').trim().replace(/['’]S$/,'');
    if(STOP.has(txt) || txt.length<2) continue;
    out.push({text:txt, paren:m[1]||''});
  }
  return out;
}
function classify(ph, castNames){
  const name = ph.text;
  if(castNames.has(name)) return 'cast';
  const last = name.split(/\s+/).pop();
  if(EXTRA_WORDS.has(last)) return 'extras';
  if(ph.paren && /^\d+s?$/i.test(ph.paren.trim()) && /S$/.test(last)) return 'extras';
  if(WARDROBE_RE.test(name)) return 'wardrobe';
  if(VEHICLE_RE.test(name)) return 'vehicles';
  if(SOUND_RE.test(name)) return 'sound';
  return 'props';
}
function castPresent(text, names){
  let t = text; const found=[];
  for(const n of [...names].sort((a,b)=>b.length-a.length)){
    // generic roles ("old man", "passenger") only count when written in capitals, so a passing mention isn't the same actor
    const flags = EXTRA_WORDS.has(n.split(/\s+/).pop()) ? 'g' : 'gi';
    const re = new RegExp('(?<![\\w\'’])'+reEsc(n)+'(?![\'’][sS]\\b)(?![\\w])',flags);
    if(re.test(t)) found.push(n);
    t = t.replace(new RegExp('(?<![\\w\'’])'+reEsc(n)+'(?![\\w])','gi'), m=>'_'.repeat(m.length));
  }
  return found;
}
function eighthsOf(d){
  let lines=2;
  for(const e of d.els){
    if(e.type==='action') lines += Math.ceil(e.text.length/58)+1;
    else if(e.type==='cue') lines += 1;
    else if(e.type==='paren') lines += Math.ceil(e.text.length/22);
    else if(e.type==='dialogue') lines += Math.ceil(e.text.length/34)+1;
    else lines += 2;
  }
  return Math.max(1, Math.round(lines/54*8));
}
function statsOf(text){ const p=parseScript(text); return {scenes:p.scenes.length, eighths:p.scenes.reduce((a,s)=>a+eighthsOf(s),0), title:p.title, author:p.author}; }

/* ---------- comparing revisions ---------- */
function matchScenes(oldScenes, newScenes){
  const used=new Set(), map=new Map(), status=new Map();
  const key = s => s.heading.toUpperCase().replace(/\s+/g,' ').trim();
  const body = s => s.els.map(e=>e.text).join('\n');
  for(const ns of newScenes){
    const os = oldScenes.find(o=>!used.has(o.base) && key(o)===key(ns));
    if(os){ used.add(os.base); map.set(os.base, ns.base); status.set(ns.base, body(os)===body(ns) ? 'same' : 'revised'); }
    else status.set(ns.base, 'new');
  }
  // second pass: a scene whose heading changed (DAY to NIGHT, renamed set) still counts as the same scene
  const back = new Map([...map].map(([o,n])=>[n,o]));
  for(const ns of newScenes){
    if(status.get(ns.base)!=='new') continue;
    let os = oldScenes.find(o=>!used.has(o.base) && body(o)===body(ns));
    if(!os){ const prevOld = back.get(ns.base-1); const nextOld = back.get(ns.base+1);
      const guess = prevOld!=null ? prevOld+1 : (nextOld!=null ? nextOld-1 : null);
      os = oldScenes.find(o=>!used.has(o.base) && o.base===guess); }
    if(os){ used.add(os.base); map.set(os.base, ns.base); back.set(ns.base, os.base); status.set(ns.base, 'revised'); }
  }
  return {map, status, omitted: oldScenes.filter(o=>!used.has(o.base))};
}
// Carry the breakdown from one revision to the next: tags, splits and strip order follow their scenes.
function carryWork(oldText, w, newText){
  const o=parseScript(oldText), nw=parseScript(newText); const {map}=matchScenes(o.scenes, nw.scenes);
  const out = workOf(structuredClone(DEFAULTS)); out.dayLen = w.dayLen || 3;
  out.tags = (w.tags||[]).filter(t=>map.has(t.base)).map(t=>({...t, base:map.get(t.base)}));
  for(const [b, list] of Object.entries(w.splits||{})){
    const nb = map.get(+b); if(!nb) continue;
    const os = o.scenes.find(s=>s.base===+b), ns = nw.scenes.find(s=>s.base===nb);
    const kept=[];
    for(const sp of list){ const anchor = os.els[sp.at]?.text.slice(0,60); if(!anchor) continue; const at = ns.els.findIndex(e=>e.text.startsWith(anchor)); if(at>0) kept.push({...sp, at}); }
    if(kept.length){ out.splits[nb]=kept; if(w.firstCast?.[b]) out.firstCast[nb]=w.firstCast[b]; }
  }
  const remap = id => { const m=String(id).match(/^(\d+)([A-Z]?)$/); if(!m) return null; const nb=map.get(+m[1]); return nb ? nb+m[2] : null; };
  for(const [id, arr] of Object.entries(w.hidden||{})){ const nid=remap(id); if(nid) out.hidden[nid]=arr; }
  out.order = (w.order||[]).map(x=> String(x).startsWith('db') ? x : remap(x)).filter(Boolean);
  out.dayBreaks = [...(w.dayBreaks||[])];
  return out;
}

/* ---------- model ---------- */
function buildModel(){
  const parsed = parseScript(state.script);
  const derived=[]; let prevDn='D';
  for(const sc of parsed.scenes){
    const sp = (state.splits[sc.base]||[]).filter(s=>s.at>0 && s.at<sc.els.length).sort((a,b)=>a.at-b.at);
    const bounds=[0, ...sp.map(s=>s.at), sc.els.length];
    for(let k=0;k<bounds.length-1;k++){
      const h = k===0 ? sc.h : parseHeading(sp[k-1].heading);
      const dn = h.dn || prevDn; prevDn = dn;
      derived.push({
        id: sp.length ? sc.base+LETTERS[k] : String(sc.base), base:sc.base, part:k,
        heading: k===0 ? sc.heading : sp[k-1].heading.toUpperCase(), ...h, dn,
        els: sc.els.slice(bounds[k], bounds[k+1]), start: bounds[k],
        kind: k ? sp[k-1].kind : null, intercutWith: sc.intercutWith,
        castOverride: k ? (sp[k-1].cast||null) : (sp.length ? (state.firstCast[sc.base]||null) : null)
      });
    }
  }
  derived.forEach((d,i)=>{ d.cats = analyze(d, parsed, derived[i-1]); d.eighths = eighthsOf(d); d.syn = synopsisOf(d); });
  const count=new Map(), first=new Map();
  derived.forEach((d,i)=>{ for(const k of d.cats.cast.keys()){ count.set(k,(count.get(k)||0)+1); if(!first.has(k)) first.set(k,i); } });
  const castOrder=[...count.keys()].sort((a,b)=>count.get(b)-count.get(a) || first.get(a)-first.get(b));
  const castId=new Map(castOrder.map((n,i)=>[n,i+1]));
  const ids = new Set(derived.map(d=>d.id));
  if(!ids.has(state.selected)) state.selected = derived[0]?.id || null;
  const diff = app.prevText!=null ? matchScenes(parseScript(app.prevText).scenes, parsed.scenes) : null;
  const locs=[]; for(const d of derived) if(!locs.includes(d.locKey)) locs.push(d.locKey);
  return {parsed, derived, castId, castOrder, locs, sets:new Set(derived.map(d=>d.locKey)), total:derived.reduce((a,d)=>a+d.eighths,0), byId:new Map(derived.map(d=>[d.id,d])), diff};
}
function analyze(d, parsed, prev){
  const cats = Object.fromEntries(CATS.map(c=>[c.k,new Map()]));
  const hidden = new Set(state.hidden[d.id]||[]);
  const action = d.els.filter(e=>e.type==='action').map(e=>e.text).join('\n');
  const segText = d.els.map(e=>e.text).join('\n');
  const manual = state.tags.filter(t=>t.base===d.base && hasWord(segText, t.text));
  const manualKeys = new Set(manual.map(t=>t.text.toUpperCase()));
  const add=(cat,key,label,raw,auto)=>{ if(hidden.has(cat+'|'+key)) return; if(!cats[cat].has(key)) cats[cat].set(key,{label,raw,auto}); };
  for(const t of manual){ const key=t.text.toUpperCase(); add(t.cat, key, t.cat==='cast'?key:t.text, t.text, false); }
  if(Array.isArray(d.castOverride)){
    for(const n of d.castOverride) if(!manualKeys.has(n)) add('cast', n, n, n, true);
  } else {
    for(const e of d.els) if(e.type==='cue' && !manualKeys.has(e.name)) add('cast', e.name, e.name, e.name, true);
    for(const n of castPresent(action, parsed.castNames)) if(!manualKeys.has(n)) add('cast', n, n, n, true);
    if(d.part>0 && !cats.cast.size && prev && prev.base===d.base) for(const [k,v] of prev.cats.cast) add('cast', k, v.label, v.raw, true);
  }
  for(const ph of capsPhrases(action)){
    if(manualKeys.has(ph.text)) continue;
    const cat = classify(ph, parsed.castNames);
    if(cat==='cast') continue;
    add(cat, ph.text, titleCase(ph.text), ph.text, true);
  }
  return cats;
}
function synopsisOf(d){
  const a = d.els.find(e=>e.type==='action'); if(!a) return '';
  const s = a.text.split(/(?<=[.!?])\s+/)[0];
  return s.length>90 ? s.slice(0,88).trim()+'…' : s;
}

function termsFor(d){ const t=[]; for(const c of CATS) for(const [,v] of d.cats[c.k]) t.push({t:v.raw, cat:c.k}); return t; }
// seen: marks each tagged element only at its first appearance in the scene, as ADs do on paper
function highlight(text, terms, seen){
  const list = terms.filter(x=>x.t && x.t.length>1);
  if(!list.length) return esc(text);
  list.sort((a,b)=>b.t.length-a.t.length);
  const map=new Map(); list.forEach(x=>{ const k=x.t.toUpperCase(); if(!map.has(k)) map.set(k,x.cat); });
  const re = new RegExp('(?<![\\w])('+[...map.keys()].map(reEsc).join('|')+')(?![\\w])','gi');
  let out='', last=0;
  text.replace(re,(m,g,off)=>{ out+=esc(text.slice(last,off)); const k=m.toUpperCase(); const c=map.get(k); if(seen && seen.has(k)) out+=esc(m); else { out+=`<mark class="hl c-${c}" title="${CATS.find(x=>x.k===c)?.label||''}">${esc(m)}</mark>`; seen?.add(k); } last=off+m.length; return m; });
  return out+esc(text.slice(last));
}
function elHtml(e, terms, base, gi, isSplitStart, ro, seen){
  if(e.type==='action'){
    const cut = (!ro && gi>0 && !isSplitStart) ? `<button class="cut" data-act="draft" data-base="${base}" data-at="${gi}" title="Split the scene here" aria-label="Split the scene here">${icon.cut}</button>` : '';
    return `<p class="el action">${cut}${highlight(e.text, terms, seen)}</p>`;
  }
  if(e.type==='cue'){
    const isCast = terms.some(t=>t.cat==='cast' && t.t.toUpperCase()===e.name) && !(seen && seen.has(e.name));
    if(isCast) seen?.add(e.name);
    const ext = e.text.slice(e.text.toUpperCase().indexOf(e.name)+e.name.length);
    return `<p class="el cue">${isCast?`<mark class="hl c-cast">${esc(e.name)}</mark>`:esc(e.name)}${esc(ext)}</p>`;
  }
  if(e.type==='paren') return `<p class="el paren">${esc(e.text)}</p>`;
  if(e.type==='dialogue') return `<p class="el dialogue">${esc(e.text)}</p>`;
  return `<p class="el trans${e.ic?' ic':''}">${esc(e.text)}</p>`;
}
function nextIdFor(base, at){

  return base + LETTERS[sp.indexOf(at)+1];
}

function reconcileOrder(){
  const idSet=new Set(M.derived.map(d=>d.id)); const res=[]; const seen=new Set();
  for(const x of state.order||[]){
    if(String(x).startsWith('db')){ if(state.dayBreaks.includes(x)) res.push(x); continue; }
    if(idSet.has(x)){ if(!seen.has(x)){ res.push(x); seen.add(x);} continue; }
    const b = parseInt(x,10);
    M.derived.filter(d=>d.base===b && !seen.has(d.id)).forEach(d=>{ res.push(d.id); seen.add(d.id); });
  }
  for(const d of M.derived){
    if(seen.has(d.id)) continue;
    let pos=-1; for(let i=res.length-1;i>=0;i--){ const o=M.byId.get(res[i]); if(o && o.base===d.base){ pos=i; break; } }
    if(pos>=0) res.splice(pos+1,0,d.id); else res.push(d.id);
    seen.add(d.id);
  }
  for(const db of state.dayBreaks) if(!res.includes(db)) res.push(db);
  state.order = res;
  return res;
}

      day++; acc=0; continue;
    }
    const d = M.byId.get(id); if(!d) continue;
    acc += d.eighths;

  const bar = ro ? `<div class="boardBar"><span class="tcTitle">Shooting order</span><span class="bdCount">View only. Click Edit to reorder strips and plan shooting days.</span></div>` : `<div class="boardBar"><span class="tcTitle">Shooting order</span>

      <button class="btn small" data-act="plan-days">Plan shooting days</button>
      <button class="btn small" data-act="add-day">Add day break</button>
    </div>`;
  return `<div class="tableCard"><div class="tcHead">${bar}</div>
    <div class="board"><div class="strips" id="strips">
      <div class="strip hdr"><div></div><div>Sc.</div><div>I/E</div><div>Set / synopsis</div><div>D/N</div><div>Pages</div><div>Cast</div></div>

      ${ro?'':'<span>Drag strips to reorder, or focus a handle and use the arrow keys.</span>'}</div>`;

/* ---------- library and revision actions ---------- */
async function openScript(sid, n){
  BD.filter.clear();
  app.screen='workspace'; app.sid=sid; app.loading=true; app.verOpen=false; ui.msg=null; state=structuredClone(DEFAULTS); render();
  try{
    app.versions = await store.listVersions(sid);
    await loadProd(sid);
    const meta = cur();
    await showVersion(n ?? meta?.currentVersion ?? app.versions[app.versions.length-1]?.n);
  }catch(e){ app.loading=false; app.screen='library'; ui.msg={type:'err', html:'That script couldn’t be opened. Try again.'}; render(); }
}
async function showVersion(n){
  const v = app.versions.find(x=>x.n===n) || app.versions[app.versions.length-1];
  if(!v){ app.loading=false; app.screen='library'; render(); return; }
  app.loading=true; render();
  const work = await store.getWork(app.sid, v.n);
  const prev = app.versions.filter(x=>x.n<v.n).pop();
  app.prevText = prev ? prev.script : null; app.prevN = prev ? prev.n : null;
  app.vn = v.n; app.verOpen=false;
  const view = state.view || 'script';
  state = Object.assign(structuredClone(DEFAULTS), work||{}, {script:v.script, view, selected:null});
  lastSaved = JSON.stringify(workOf(state));
  ui.draft=null; ui.editing=null; ui.msg=null;
  app.loading=false; render(); window.scrollTo({top:0});
}
async function createScript(text, title, source){
  const st = statsOf(text); const now = Date.now();
  const meta = {title:(title || st.title || 'Untitled script').trim(), createdAt:now, updatedAt:now, currentVersion:1, currentLabel:'1', versionCount:1, scenes:st.scenes, eighths:st.eighths, author:st.author||'', source:source||'uploaded', bookmarked:false};
  const id = await store.createScript(meta, {n:1, label:'1', script:text, note:'First draft', createdAt:now, scenes:st.scenes, eighths:st.eighths});
  if(!app.scripts.some(s=>s.id===id)) app.scripts.unshift({id, kind:'script', ...meta});
  return id;
}
async function saveRevision(text, note, label){
  const meta = cur(); const n = Math.max(meta.versionCount||0, ...app.versions.map(v=>v.n)) + 1;
  const base = app.versions.find(v=>v.n===app.vn);
  const work = carryWork(base.script, workOf(state), text);
  const st = statsOf(text); const now = Date.now();
  const version = {n, label: label || String(n), script:text, note:note||'', createdAt:now, scenes:st.scenes, eighths:st.eighths};
  clearTimeout(saveT);
  await store.addVersion(app.sid, version);
  await store.saveWork(app.sid, n, work);
  const patch = {currentVersion:n, currentLabel:version.label, versionCount:n, updatedAt:now, scenes:st.scenes, eighths:st.eighths, author:st.author||''};
  await store.updateScript(app.sid, patch); Object.assign(meta, patch);
  app.versions.push(version);
  await showVersion(n);
}
async function updateVersion(text, note){
  const meta = cur(); const v = app.versions.find(x=>x.n===app.vn);
  const work = carryWork(v.script, workOf(state), text);
  const st = statsOf(text); const now = Date.now();
  const nv = {...v, script:text, scenes:st.scenes, eighths:st.eighths, editedAt:now, note: note || v.note || ''};
  clearTimeout(saveT);
  await store.addVersion(app.sid, nv);
  await store.saveWork(app.sid, v.n, work);
  const patch = {updatedAt:now, scenes:st.scenes, eighths:st.eighths, author:st.author||''};
  await store.updateScript(app.sid, patch); Object.assign(meta, patch);
  Object.assign(v, nv);
  await showVersion(v.n);
  ui.msg = {type:'info', html:`Saved to <b>version ${esc(vlabel(v))}</b>. No new version was created.`}; renderNotice();
}
async function makeCurrent(){
  const meta=cur(); const v=app.versions.find(x=>x.n===app.vn);

  catch(e){ ui.msg={type:'err', html:'Couldn’t change the current version. Try again.'}; }

}

function nextLabels(){
  const all = app.versions.map(v=>parseLabel(vlabel(v)));

/* ---------- pages: one continuous scroll, cut into script pages like a document editor ---------- */
const LINES_PER_PAGE = 55;
const KEEP_WITH_NEXT = el => el.matches('.head, .ehRow, .splitMark, .chipline, .el.cue, .el.paren, .eel.cue, .eel.paren');
function paginate(){
  const paper = document.getElementById('paper'); if(!paper || paper.classList.contains('pkPaper')) return;
  paper.querySelectorAll('.pgBreak, .pgEnd').forEach(n=>n.remove());
  const cs = getComputedStyle(paper);
  const lh = parseFloat(cs.lineHeight) || 20, padT = parseFloat(cs.paddingTop), padB = parseFloat(cs.paddingBottom);
  const padL = parseFloat(cs.paddingLeft), padR = parseFloat(cs.paddingRight);
  const P = Math.round(LINES_PER_PAGE * lh); const GAP = 28;
  const blocks = paper.classList.contains('editPaper')
    ? [...paper.children].filter(n=>!n.classList.contains('edLegend'))
    : [...paper.querySelectorAll('.head, .chipline, .sugg, .el')];
  if(!blocks.length) return;
  const base = paper.getBoundingClientRect().top + padT;
  const rect = blocks.map(b=>{ const r=b.getBoundingClientRect(); const m=getComputedStyle(b); return {top:r.top-base-parseFloat(m.marginTop||0), bottom:r.bottom-base+parseFloat(m.marginBottom||0)}; });
  let pageStart = 0, page = 1; const cuts = [];
  for(let i=0;i<blocks.length;i++){
    if(rect[i].bottom - pageStart <= P || rect[i].top <= pageStart) continue;
    let j = i; // keep headings and character names with the line that follows them
    while(j-1>0 && KEEP_WITH_NEXT(blocks[j-1]) && rect[j-1].top > pageStart) j--;
    if(rect[j].top <= pageStart) j = i;
    cuts.push({at:j, fill: Math.max(0, P - (rect[j].top - pageStart))});
    pageStart = rect[j].top; i = j;
  }
  const styleBreak = (d, a) => {
    a = Math.max(0, a); const b = a + GAP;
    d.style.cssText = `height:${b+padT}px;margin-left:-${padL}px;margin-right:-${padR}px;background:linear-gradient(var(--paper) 0 ${a}px, var(--bg) ${a}px ${b}px, var(--paper) ${b}px)`;
    d.innerHTML = `<i style="top:${a}px;height:${GAP}px"></i><span class="pgNum" style="top:${b+Math.min(28,padT/2)}px;right:${padR}px">${d.dataset.n}.</span>`;
  };
  const made = cuts.map((c,k)=>{ const d=document.createElement('div'); d.className='pgBreak'; d.contentEditable='false'; d.setAttribute('aria-hidden','true'); d.dataset.n=k+2; styleBreak(d, c.fill+padB); blocks[c.at].parentNode.insertBefore(d, blocks[c.at]); return d; });
  // margins around a cut can shift pages by a few pixels; line every page gap up exactly
  const pageH = padT + P + padB; const top0 = paper.getBoundingClientRect().top;
  made.forEach((d,k)=>{ const want = (k+1)*pageH + k*GAP; const at = d.getBoundingClientRect().top - top0; styleBreak(d, want - at); });
  // fill the last page so it has full height too
  const end = document.createElement('div'); end.className='pgEnd'; end.setAttribute('aria-hidden','true'); end.contentEditable='false'; paper.appendChild(end);
  const pages = made.length + 1; const wantEnd = pages*pageH + made.length*GAP; const nowEnd = paper.getBoundingClientRect().bottom - paper.getBoundingClientRect().top;
  end.style.height = Math.max(0, wantEnd - nowEnd) + 'px';
  const total = cuts.length + 1;
  const lbl = document.getElementById('pageCount'); if(lbl) lbl.textContent = `${total} page${total>1?'s':''}`;
}
let pgT=null;
const paginateSoon = (ms=0) => { clearTimeout(pgT); pgT=setTimeout(()=>requestAnimationFrame(paginate), ms); };

  if(e.kind==='off' || (e.kind==='busy' && !hrs)){ short='Not available'; level='off'; }

/* ---------- conflicts for a call sheet ---------- */
function sheetIssues(sh){
  const out=[]; if(!sh.date) return out;
  const scenes = (sh.scenes||[]).map(s=>M.byId.get(s.id)).filter(Boolean);
  for(const c of castOnSheet(sh)){
    const who = c.actor ? `${castLabel(c)} (${c.actor})` : castLabel(c);
    const st = dayStatus(c, sh.date); const w = castWindow(sh, c);
    if(st?.level==='off') out.push(`${who} is not available on ${fmtDateShort(sh.date)}${st.note?` (${st.note})`:''}.`);
    else if(st && windowClash(st, toMin(w.start), toMin(w.end))) out.push(`${who} is ${st.short.toLowerCase()}${st.note?` (${st.note})`:''}, but works ${w.start||'?'}–${w.end||'?'} on this day.`);
    if(w.start && c.from && w.start < c.from) out.push(`${who} is called at ${w.start} but usually starts at ${c.from}.`);
    if(w.end && c.to && w.end > c.to) out.push(`${who} usually finishes by ${c.to}, but works until ${w.end}.`);
  }
  const locs = [...new Set(scenes.map(d=>d.locKey))];
  for(const k of locs){
    const L = locFor(k); if(!L) continue;
    if((L.available||[]).length && !L.available.includes(sh.date)) out.push(`${k} is not available on ${fmtDateShort(sh.date)}.`);
    if(sh.crewCall && L.from && sh.crewCall < L.from) out.push(`${k} opens at ${L.from}, but crew call is ${sh.crewCall}.`);
    if(sh.wrap && L.to && sh.wrap > L.to) out.push(`${k} closes at ${L.to}, but wrap is ${sh.wrap}.`);
  }
  for(const m of Object.values(PROD.crew)) if((m.unavailable||[]).includes(sh.date)) out.push(`${m.name||m.role||'A crew member'} (${m.role||m.dept}) is unavailable on ${fmtDateShort(sh.date)}.`);
  return out;
}
function sceneIssues(d, date){
  if(!date) return [];
  const out=[];
  for(const c of castItemsFor(d)){ const st = dayStatus(c, date); if(st && st.level!=='ok') out.push({level:st.level, text:`${castLabel(c)} ${st.level==='off'?'not available':st.short.charAt(0).toLowerCase()+st.short.slice(1)}`, title:st.label}); }
  const L=locFor(d.locKey); if(L && (L.available||[]).length && !L.available.includes(date)) out.push({level:'off', text:'Location unavailable', title:''});
  return out;
}
function dayCastSummary(date, castList){
  if(!date) return '';
  const list = (castList || Object.values(PROD.cast)).map(c=>({c, st:dayStatus(c, date)})).filter(x=>x.st && x.st.level!=='ok');
  if(!list.length) return `<div class="daySum ok"><b>${fmtDateShort(date)}:</b> no one in the cast has told you they're busy.</div>`;
  return `<div class="daySum"><b>${fmtDateShort(date)}:</b> ${list.map(({c,st})=>`<span class="dsItem ${st.level}">${photoHtml(c.photo, c.actor||castLabel(c), 'avxs')}<b>${esc(castLabel(c))}</b> ${esc(st.short.charAt(0).toLowerCase()+st.short.slice(1))}${st.note?` <span class="muted">(${esc(st.note)})</span>`:''}</span>`).join('')}<span class="muted">Everyone else is free.</span></div>`;
}

/* sharing */
function sheetText(sh){
  const {n,of}=dayNo(sh); const meta=cur(); const ds=(sh.scenes||[]).map(s=>({s,d:M.byId.get(s.id)})).filter(x=>x.d);
  const L=[]; const line=(a)=>L.push(a);
  line(`${meta.title} — CALL SHEET`); line(`Day ${n} of ${of} · ${fmtDate(sh.date)}`);
  line(`Crew call ${sh.crewCall||'—'} · Shooting call ${sh.shootCall||'—'} · Lunch ${sh.lunch||'—'} · Wrap ${sh.wrap||'—'}`);
  if(sh.weather||sh.sunrise||sh.sunset) line(`Weather: ${sh.weather||'—'} · Sunrise ${sh.sunrise||'—'} · Sunset ${sh.sunset||'—'}`);
  const locKeys=[...new Set(ds.map(x=>x.d.locKey))];
  locKeys.forEach(k=>{ const l=locFor(k)||{}; line(`Location: ${k}${l.address?' — '+l.address:''}${l.parking?' (parking: '+l.parking+')':''}`); });
  if(sh.basecamp) line(`Basecamp: ${sh.basecamp}`); if(sh.hospital) line(`Nearest hospital: ${sh.hospital}`); if(sh.safety) line(`Safety: ${sh.safety}`);
  line(''); line('SCENES'); ds.forEach(({s,d})=>line(`${s.time?s.time+(s.end?'–'+s.end:'')+'  ':''}${d.id}  ${d.ie} ${d.set}  ${d.dn==='N'?'N':'D'}  ${fmt8(d.eighths)} pg  ${[...d.cats.cast.keys()].map(titleCase).join(', ')}`));
  const castL=castOnSheet(sh);
  if(castL.length){ line(''); line('CAST'); castL.forEach(c=>{ const cc=sh.castCalls?.[callKey(c)]||{}; line(`${castLabel(c)}${c.actor?' — '+c.actor:''}: pickup ${cc.pickup||'—'}, makeup ${cc.mu||'—'}, on set ${cc.set||'—'}${cc.note?' ('+cc.note+')':''}`); }); }
  const crew=Object.values(PROD.crew); if(crew.length){ line(''); line('CREW'); crew.sort((a,b)=>DEPTS.indexOf(a.dept)-DEPTS.indexOf(b.dept)).forEach(m=>line(`${m.dept}: ${m.name||'—'} (${m.role||''}) ${sh.crewCalls?.[m.id]||sh.crewCall||''}`)); }
  if((sh.tech||[]).length){ line(''); line('TECHNICAL'); sh.tech.forEach(r=>line(`${r.item||'—'} — ${r.time||'—'}${r.contact?' · '+r.contact:''}${r.note?' · '+r.note:''}`)); }
  if((sh.admin||[]).length){ line(''); line('ADMIN & TRANSPORT'); sh.admin.forEach(r=>line(`${r.item||'—'} — ${r.time||'—'}${r.contact?' · '+r.contact:''}${r.note?' · '+r.note:''}`)); }
  if(sh.notes){ line(''); line('NOTES'); line(sh.notes); }
  return L.join('\n');
}
function personText(sh, who){
  const [kind, key] = who.split('|'); const meta=cur(); const ds=(sh.scenes||[]).map(s=>M.byId.get(s.id)).filter(Boolean);
  const loc = ds[0] ? (locFor(ds[0].locKey)?.address ? `${ds[0].locKey}, ${locFor(ds[0].locKey).address}` : ds[0].locKey) : 'location to be confirmed';

// email-safe HTML (inline styles only)
function sidesEmailHtml(sh, c){
  const F = 'font-family:Courier New,Courier,monospace;font-size:14px;line-height:1.45;color:#111;';
  const mineIds = new Set(c ? sidesScenes(sh).filter(({d})=>castItemsFor(d).includes(c)).map(({d})=>d.id) : []);
  const scenes = sidesScenes(sh).map(({s,d})=>{
    const mine = mineIds.has(d.id);
    const els = d.els.map(e=>{
      const t = esc(e.text);
      if(e.type==='cue') return `<p style="${F}margin:14px 0 0 38%;text-transform:uppercase">${t}</p>`;
      if(e.type==='paren') return `<p style="${F}margin:0 0 0 30%;max-width:40%">${t}</p>`;
      if(e.type==='dialogue') return `<p style="${F}margin:0 18% 0 20%">${t}</p>`;
      if(e.type==='action') return `<p style="${F}margin:12px 0 0">${t}</p>`;
      return `<p style="${F}margin:12px 0 0;text-align:right;text-transform:uppercase">${t}</p>`;
    }).join('');
    return `<div style="margin:0 0 28px;padding:${mine?'10px 14px':'0 14px'};border-left:${mine?'4px solid #4F46E5':'4px solid transparent'}"><p style="${F}font-weight:bold;margin:0;text-transform:uppercase">${d.id}&nbsp;&nbsp;${d.ie==='I/E'?'INT./EXT.':d.ie+'.'} ${esc(d.set)} - ${esc(dnLabel(d))}${mine?' &nbsp;<span style="font-family:Arial,sans-serif;font-size:11px;background:#EEF0FF;color:#4F46E5;padding:2px 6px;border-radius:4px">YOUR SCENE</span>':''}</p>${s.time?`<p style="font-family:Arial,sans-serif;font-size:12px;color:#666;margin:2px 0 0">Shooting ${esc(s.time)}${s.end?'–'+esc(s.end):''}</p>`:''}${els}</div>`;
  }).join('');
  return `<div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#111;max-width:680px">${c?`<p>${esc(sidesIntro(sh, c)).replace(/\n/g,'<br>')}</p>`:''}<hr style="border:0;border-top:1px solid #ddd;margin:20px 0">${scenes}</div>`;
}

function addAvail(id){

function refreshCard(id){ const el=document.querySelector(`#view [data-person="${CSS.escape(id)}"]`); const c=PROD.cast[id]; if(el && c) el.outerHTML = castCard(c); }
function mcpErrorText(err, what){
  const code = err?.code;
  if(code==='server_not_connected' || code==='server_not_found') return `${what} isn’t connected. Add it in claude.ai under Settings → Connectors, then try again.`;
  if(code==='needs_reauth') return `${what} needs you to sign in again. Reconnect it in claude.ai under Settings → Connectors.`;
  if(code==='not_in_manifest' || code==='approval_required' || code==='not_granted' || code==='consent_required') return `AD Desk needs your permission to use ${what}. Try again and choose Allow.`;
  if(code==='blocked_by_policy') return `Your organization doesn’t allow ${what} here.`;
  if(code==='selection_required') return `You have more than one ${what} connected. Choose one when claude.ai asks.`;
  if(code==='capability_disabled' || code==='capability_removed') return `Connectors aren’t available in this view. Open AD Desk in claude.ai.`;
  if(code==='tool_error') return `${what} refused: ${esc(String(err.message||'').slice(0,200))}`;
  return `${what} didn’t answer. Check before trying again, in case it went through.`;
}
async function sidesSend(){
  const sh = PROD.sheets[PROD.open]; const S = PROD.sides; if(!sh || S.busy) return;
  const to = castOnSheet(sh).filter(c=>/\S+@\S+\.\S+/.test(c.email||'') && !S.skip.has(c.id));
  if(!to.length) return;
  let mcp = null; try{ mcp = window.claude?.use ? await window.claude.use('mcp') : null; }catch(_){}
  if(!mcp){ S.msg={type:'err', html:'Email isn’t available in this view. Download the sides or copy them instead.'}; renderPside(); return; }
  const msgs = to.map(c=>({c, to:[c.email.trim()], subject:sidesSubject(sh), body:sidesPlain(sh, c), htmlBody:sidesEmailHtml(sh, c)}));
  sh.sidesLog ||= {};
  if(S.when==='later'){
    const at = document.getElementById('sdAt')?.value || S.at; const when = at ? new Date(at) : null;
    if(!when || isNaN(when) || when.getTime() < Date.now()+60000){ S.msg={type:'err', html:'Pick a time in the future.'}; renderPside(); return; }
    S.busy = true; S.msg = null; renderPside();
    const prompt = `Send these ${msgs.length} emails now with the Gmail connector's send_message tool, one call per email, using the fields exactly as given (to, subject, htmlBody). Do not change the content and do not send anything else. Afterwards, list who each email went to.\n\n` + JSON.stringify(msgs.map(m=>({to:m.to, subject:m.subject, htmlBody:m.htmlBody})));
    try{
      const r = await mcp.callTool('Claude Code Remote', 'create_trigger', {name:`AD Desk: sides for ${cur().title} Day ${dayNo(sh).n}`.slice(0,120), prompt, run_once_at: when.toISOString(), initiation:'human_request'});
      for(const m of msgs) sh.sidesLog[m.c.id] = {kind:'scheduled', at:Date.now(), for:when.getTime(), task: r?.payload?.trigger?.id || r?.payload?.id || ''};
      saveItem('sheets', sh.id);
      S.msg = {type:'ok', html:`Scheduled for ${esc(fmtDT(when.getTime()))}. You’ll find it in Claude under Scheduled tasks, where you can change or cancel it.`};
    }catch(err){ S.msg = {type:'err', html: mcpErrorText(err, 'Scheduling')}; }
    S.busy = false; renderPside(); return;
  }
  S.busy = true; S.msg = null; renderPside();
  const ok = [], fail = [];
  for(const m of msgs){
    try{ await mcp.callTool('Gmail', 'send_message', {to:m.to, subject:m.subject, body:m.body, htmlBody:m.htmlBody}); ok.push(m); sh.sidesLog[m.c.id] = {kind:'sent', at:Date.now()}; }
    catch(err){ fail.push({m, err}); if(['server_not_connected','needs_reauth','not_in_manifest','approval_required','not_granted','blocked_by_policy','capability_disabled','consent_required'].includes(err?.code)) break; }
  }
  if(ok.length) saveItem('sheets', sh.id);
  const okTxt = ok.length ? `Sent to ${ok.map(m=>esc(m.c.actor||castLabel(m.c))).join(', ').replace(/\.$/,'')}.` : '';
  S.msg = fail.length ? {type:'err', html:`${okTxt} ${mcpErrorText(fail[0].err, 'Gmail')}`.trim()} : {type:'ok', html:okTxt};
  S.busy = false; renderPside();
}

function startOnboard(mode){
  const p = app.profile || {};
  app.onb = {mode, step:0, err:'', busy:false, d:{name:p.name || me?.name || '', role:p.role || '', production:p.production || '', ptype:p.ptype || '', shootStart:p.shootStart || ''}};
  app.screen = 'onboard'; render(); window.scrollTo(0,0);
}
async function goLogin(){
  if(!app.ready || !app.authChecked){ app.pendingLogin = true; app.screen='onboard'; app.onb={mode:'login', step:0, err:'', busy:true, d:{}}; render(); return; }
  if(app.profile || app.scripts.length){ app.screen='library'; app.welcome = true; render(); window.scrollTo(0,0); return; }
  startOnboard('login-new');
}

async function finishOnboard(then){
  const o = app.onb; if(o.busy) return; o.busy = true;
  const now = Date.now();
  const prof = {...(app.profile||{}), name:o.d.name.trim(), role:o.d.role, production:o.d.production.trim(), ptype:o.d.ptype, shootStart:o.d.shootStart, updatedAt:now, createdAt:app.profile?.createdAt || now};
  try{ await store.setProfile(prof); app.profile = prof; }
  catch(e){ o.busy=false; o.err='Your profile couldn’t be saved. Check your connection and try again.'; render(); return; }
  app.onb = null; app.screen = 'library'; app.welcome = true; render(); window.scrollTo(0,0);
  if(then==='upload') openModal('new');
  else if(then==='write') openModal('write');
  else if(then==='sample'){ app.busy=true; render(); try{ const id=await createScript(SAMPLES.find(s=>s.key==='tram').text, '', 'uploaded'); app.busy=false; await openScript(id,1); }catch(err){ app.busy=false; ui.msg={type:'err', html:'The sample couldn’t be added. Try again from the library.'}; render(); } }
}
function frontAction(a, t){
  switch(a){
    case 'ld-tab': LD.tab=t.dataset.t; document.querySelectorAll('.ldTabs [role="tab"]').forEach(b=>b.setAttribute('aria-selected', b.dataset.t===LD.tab)); { const m=document.getElementById('ldMock'); if(m){ m.innerHTML=ldMock(LD.tab); m.classList.remove('swap'); void m.offsetWidth; m.classList.add('swap'); } } return true;
    case 'ld-go': document.getElementById(t.dataset.to)?.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'start'}); return true;
    case 'ld-top': window.scrollTo({top:0, behavior:'smooth'}); return true;
    case 'go-start': startOnboard('new'); return true;
    case 'acct-menu': app.acct=!app.acct; renderSide(); return true;
    case 'acct-edit': app.acct=false; app.onbFrom='app'; if(ui.edit?.dirty){ ui.edit.warn=true; updateEditBar(); return true; } ui.edit=null; startOnboard('edit'); return true;
    case 'acct-home': app.acct=false; if(ui.edit?.dirty){ ui.edit.warn=true; updateEditBar(); return true; } ui.edit=null; ui.ctl?.abort(); app.screen='landing'; app.sid=null; render(); window.scrollTo(0,0); return true;
    case 'go-login': goLogin(); return true;
    case 'go-app': app.screen='library'; render(); window.scrollTo(0,0); return true;
    case 'ob-home': app.onb=null; app.screen = app.onbFrom==='app' ? 'library' : 'landing'; app.onbFrom=null; render(); window.scrollTo(0,0); return true;
    case 'ob-pick': app.onb.d[t.dataset.f]=t.dataset.v; render(); return true;
    case 'ob-next': if(app.onb.step===1){ app.onb.d.name=document.getElementById('obName')?.value||app.onb.d.name; } app.onb.step++; app.onb.err=''; render(); setTimeout(()=>document.querySelector('.obBody input')?.focus(),0); return true;
    case 'ob-back': app.onb.step=Math.max(0, app.onb.step-1); render(); return true;
    case 'ob-finish': finishOnboard(t.dataset.then); return true;
  }
  return false;
}
document.addEventListener('input', e=>{
  const f = e.target.dataset?.ob; if(!f || !app.onb) return;
  app.onb.d[f] = e.target.value;
  const side = document.querySelector('.obSide .obCard'); if(side) side.outerHTML = obPreview(app.onb.d);
  const o = app.onb, d = o.d; const ok = o.step===1 ? d.name.trim() && d.role : o.step===2 ? d.production.trim() && d.ptype : true;
  const btn = document.querySelector('.obBtns [data-act="ob-next"]'); if(btn) btn.disabled = !ok;
  const hint = document.querySelector('.obHint'); if(hint) hint.hidden = !!ok;
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && app.screen==='onboard' && e.target.matches?.('.obInput')){ const b=document.querySelector('.obBtns [data-act="ob-next"]'); if(b && !b.disabled){ e.preventDefault(); b.click(); } }
});

/* ---------- workspace actions ---------- */
const MUT = new Set(['accept','dismiss','edit','edit-save','accept-all','dismiss-all','undo-split','draft','draft-save','rm-tag','group','script-order','add-day','rm-day','plan-days','find','edit-script']);
function acceptSplit(base, at, heading, kind, reason, cast){
  const list = state.splits[base] || (state.splits[base]=[]);
  if(!list.some(s=>s.at===at)) list.push({at, heading:heading.toUpperCase(), kind, reason, cast: cast||null});
  const s = (state.suggestions[base]||[]).find(x=>x.at===at); if(s) s.status='accepted';
}
function selectSeg(id){
  if(state.selected===id) return;
  state.selected=id;
  document.querySelectorAll('.seg').forEach(s=>s.classList.toggle('sel', s.dataset.id===id));
  const sh=document.getElementById('sheet'); if(sh) sh.innerHTML = sheetHtml();
}
document.addEventListener('click', async e=>{
  const t = e.target.closest('[data-act]');
  if(app.verOpen && !e.target.closest('.revWrap')){ app.verOpen=false; renderBar(); }
  if(BD.filterOpen && !e.target.closest('.fltWrap')){ BD.filterOpen=false; render(); return; }
  if(app.acct && !e.target.closest('.acctWrap')){ app.acct=false; renderSide(); }
  if(app.menu && !e.target.closest('.menuWrap')){ app.menu=null; if(app.screen==='library') render(); }
  if(ui.edit && ((ui.edit.savePop && !e.target.closest('.saveWrap')) || (ui.edit.typeMenu && !e.target.closest('.typeWrap')))){ ui.edit.savePop=false; ui.edit.typeMenu=false; updateEditBar(); }
  if(!t){
    const seg = e.target.closest('.seg');
    if(seg && document.getSelection().isCollapsed) selectSeg(seg.dataset.id);
    return;
  }
  const a=t.dataset.act, base=+t.dataset.base, at=+t.dataset.at;
  if(frontAction(a, t)) return;
  if(ui.edit && NAV.has(a)){
    if(ui.edit.dirty){ ui.edit.warn=true; updateEditBar(); return; }
    ui.edit=null;
  }
  if(MUT.has(a) && (RO() || (!ui.edit && a!=='edit-script'))) return;
  if(app.screen==='workspace' && prodAction(a, t, e)) return;
  switch(a){
    // library
    case 'home': if(app.screen!=='library'){ ui.ctl?.abort(); app.screen='library'; app.sid=null; ui.msg=null; hidePop(); render(); } break;

function checkSel(){
  if(app.screen!=='workspace' || RO() || !M || !ui.edit || ui.edit?.savePop || ui.edit?.typeMenu){ hidePop(); return; }
  const sel=document.getSelection();
  if(!sel || sel.isCollapsed || !sel.rangeCount){ hidePop(); return; }
  const text = sel.toString().replace(/\s+/g,' ').trim().replace(/^[^\w]+|[^\w]+$/g,'');
  const range = sel.getRangeAt(0);
  const node = range.commonAncestorContainer.nodeType===1 ? range.commonAncestorContainer : range.commonAncestorContainer.parentElement;
  if(!text || text.length>60){ hidePop(); return; }
  let base, id;
  if(ui.edit){
    const el = node?.closest?.('.eel'); if(!el){ hidePop(); return; }
    if(el.dataset.base===''){ ui.pending=null; pop.innerHTML = `<div class="q">This scene is new. Save it first, then tag it.</div>`; return placePop(range); }
    base = +el.dataset.base; id = M.derived.find(d=>d.base===base)?.id;
  } else {
    const el = node?.closest?.('.el'); const seg = node?.closest?.('.seg');
    if(!el || !seg){ hidePop(); return; }
    const d = M.byId.get(seg.dataset.id); if(!d){ hidePop(); return; }
    base = d.base; id = d.id;
  }
  const now = existingTag(base, text.toUpperCase());
  ui.pending = {base, text, id, now};
  pop.innerHTML = `<div class="q">${now?`<b>${esc(text)}</b> is tagged as ${CATS.find(c=>c.k===now).label}`:`Tag <b>${esc(text)}</b> as`}</div><div class="grid">${CATS.map(c=>`<button class="c-${c.k}${now===c.k?' on':''}" data-tag="${c.k}"><span class="dot${c.k==='wardrobe'?' ring':''}"></span>${c.label}</button>`).join('')}</div>${now?'<button class="untag" data-tag="__remove">Remove tag</button>':''}`;
  placePop(range);
}
function placePop(range){
  pop.hidden=false;
  const r = range.getBoundingClientRect(); const pw = pop.offsetWidth, ph = pop.offsetHeight;
  const left = Math.min(Math.max(12, r.left + r.width/2 - pw/2), window.innerWidth - pw - 12);
  let top = r.bottom + 8; if(top + ph > window.innerHeight - 12) top = Math.max(12, r.top - ph - 8);
  top = Math.min(Math.max(12, top), window.innerHeight - ph - 12);
  pop.style.left=left+'px'; pop.style.top=top+'px';
}
function removeTag(base, cat, key){
  const before = state.tags.length;
  state.tags = state.tags.filter(x=>!(x.base===base && x.text.toUpperCase()===key));
  if(state.tags.length===before) for(const d of M.derived) if(d.base===base){ const h=(state.hidden[d.id] ||= []); if(!h.includes(cat+'|'+key)) h.push(cat+'|'+key); }

function applySuggestions(list){
  const out={}; state.firstCast = {};
  for(const sc of list){
    const scene = M.parsed.scenes.find(s=>s.base===Number(sc.scene)); if(!scene || !Array.isArray(sc.splits)) continue;
    const seen=new Set(); const arr=[];
    for(const sp of sc.splits){
      const at = sp.anchor!=null ? scene.els.findIndex(e=>e.text.startsWith(sp.anchor)) : Math.round(Number(sp.at));
      if(!Number.isFinite(at) || at<=0 || at>=scene.els.length || seen.has(at) || typeof sp.heading!=='string' || !sp.heading.trim()) continue;
      seen.add(at);
      const already = (state.splits[scene.base]||[]).some(s=>s.at===at);
      arr.push({base:scene.base, at, heading:sp.heading.trim().toUpperCase(), kind:['location','intercut','flashback'].includes(sp.kind)?sp.kind:'location', reason:String(sp.reason||'').slice(0,120), cast:castList(sp.cast), status: already?'accepted':'pending'});
    }
    if(arr.length){ out[scene.base]=arr.sort((a,b)=>a.at-b.at); const fc=castList(sc.first_cast); if(fc&&fc.length) state.firstCast[scene.base]=fc; }
  }
  return out;
}
function buildPrompt(){
  let s = `You are a first assistant director doing a script breakdown. Screenwriters often pack several setups into one scene: the action moves to another location, cuts to another place (such as the other side of a phone call), or jumps in time (a flashback), without writing a new scene heading. Each of those must be scheduled and shot as its own scene.

For each scene below, the elements are numbered [0], [1], [2]... Find every element where a hidden setup begins.

Rules:
- Split only where the camera must be at a different set or location, or in a different time period. Do not split for movement inside the same room.
- Returning to an earlier location after a cut-away also counts as a new setup.
- "at" is the index of the first element of the new setup. It is never 0.
- "heading" is a standard scene heading for the new setup, like "INT. ARAM'S BARBERSHOP - MORNING" or "EXT. VILLAGE YARD - DAY (FLASHBACK)". Reuse the script's own location names where they match, and keep the time of day consistent.
- "kind" is one of "location", "intercut", "flashback".
- "reason" is one short sentence, at most 10 words.
- "cast" lists the characters physically on camera in that setup, using the script's character names in capitals. A voice on the other end of a phone call is not on camera.
- "first_cast" lists the characters on camera in the part of the scene before the first split.
- Leave out scenes that need no splits.

Reply with only JSON in this shape:
{"scenes":[{"scene":2,"first_cast":["ANNA"],"splits":[{"at":3,"heading":"INT. EXAMPLE - DAY","kind":"location","reason":"Moves to another room.","cast":["ANNA","BEN"]}]}]}

SCRIPT
`;
  for(const sc of M.parsed.scenes){
    s += `\nSCENE ${sc.base}: ${sc.heading}\n`;
    sc.els.forEach((e,i)=>{ s += `[${i}] ${e.type.toUpperCase()}: ${e.text}\n`; });
  }
  return s.slice(0, 200000);
}

    {anchor:'BEGIN MONTAGE', heading:'EXT. OPERA HOUSE - NIGHT (MONTAGE)', kind:'location', reason:'Montage shot at the Opera House steps.', cast:[]},
    {anchor:'-- At the Blue Mosque', heading:'EXT. BLUE MOSQUE - MASHTOTS AVENUE - NIGHT (MONTAGE)', kind:'location', reason:'Montage shot outside the Blue Mosque.', cast:[]},
    {anchor:'-- On Abovyan Street', heading:'EXT. ABOVYAN STREET - NIGHT (MONTAGE)', kind:'location', reason:'Students run alongside the tram.', cast:[]},
    {anchor:'-- Inside, the passengers sing', heading:'INT. TRAM NO. 7 - MOVING - NIGHT (MONTAGE)', kind:'location', reason:'Inside the tram, passengers singing.', cast:['ANUSH','TATEV']},
  ]},
];
const SAMPLES = [
  {key:'spare', title:'The Spare Key', blurb:'9 scenes · about 4 pages', text:SAMPLE, analysis:SAMPLE_ANALYSIS},
  {key:'tram', title:'The Last Tram', blurb:'23 scenes · about 9 pages', text:SAMPLE2, analysis:SAMPLE2_ANALYSIS},
];
const sampleOf = () => SAMPLES.find(s=>norm(s.text)===norm(state.script));
const isSample = () => !!sampleOf();
async function findHidden(){
  if(ui.running || RO()) return;
  if(!M.parsed.scenes.length){ ui.msg={type:'err', html:'This script has no scene headings yet.'}; render(); return; }
  ui.running=true; ui.msg=null; render();
  const sid=app.sid, vn=app.vn;
  const stillHere = () => app.screen==='workspace' && app.sid===sid && app.vn===vn;
  let sample=null;
  try{ sample = window.claude?.use ? await window.claude.use('sample') : null; }catch(_){ sample=null; }
  const useSaved = ()=>{ if(!stillHere()){ ui.running=false; return; } state.suggestions = applySuggestions(sampleOf().analysis); state.analysis='saved'; ui.running=false; render(); };
  if(!sample){
    if(isSample()) return useSaved();
    ui.running=false; ui.msg={type:'err', html: IN_CLAUDE() ? 'Finding hidden scenes needs Claude, which isn’t available in this view. You can still split scenes by hand: hover a paragraph in the script and use the scissors.' : 'Automatic scene detection is part of the Claude version of AD Desk. Here you can split scenes by hand: hover a paragraph in the script and use the scissors.'}; render(); return;
  }
  ui.ctl = new AbortController();
  try{
    const res = await sample.json(buildPrompt(), {signal: ui.ctl.signal, modelTier:'default'});
    ui.running=false;
    if(!stillHere()) return;
    state.suggestions = applySuggestions(Array.isArray(res?.scenes) ? res.scenes : []); state.analysis='ai';
    if(!Object.values(state.suggestions).flat().length) ui.msg={type:'info', html:'No hidden setups found. Every scene stays in one location and time.'};
    render();
  }catch(e){
    ui.running=false;
    const code = e?.code;
    if(code==='cancelled' || !stillHere()){ if(stillHere()) render(); return; }
    if(isSample() && code!=='refused') return useSaved();
    ui.msg={type:'err', html:({
      not_granted:'Claude access was declined for this page, so hidden scenes can’t be detected. You can still split scenes by hand with the scissors.',
      sampling_disabled:'Claude isn’t available for this account. You can still split scenes by hand with the scissors.',
      rate_limited:'Too many requests right now. Wait a minute and try again.',
      invalid_json:'Claude’s answer couldn’t be read. Try again.',
      prompt_too_large:'This script is too long to read in one go.',
    })[code] || 'Something went wrong while reading the script. Try again.'}; render();
  }finally{ ui.ctl=null; }
}

/* ---------- start ---------- */
async function init(){
  render();
  let db=null, user=null;
  try{ if(window.claude?.use) [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); }catch(_){}
  let uid=null;
  if(db && user){ try{ me = await user.me(); uid = me.id; }catch(_){} }
  store = (db && uid) ? cloudStore(db, uid) : localStore();
  const onList = list => {
    const first = !app.ready; app.scripts = list; app.ready = true;
    if(app.screen==='library' || (first && app.screen==='landing')) render();
    else if(app.screen==='workspace' && !app.loading && M) { renderSide(); renderBar(); renderNotice(); }
    maybeResumeLogin();
  };
  try{ store.watchScripts(onList, ()=>{ ui.msg={type:'err', html:'Your scripts couldn’t be loaded. Reload the page to try again.'}; app.ready=true; render(); }); }
  catch(_){ store = localStore(); store.watchScripts(onList); }
  try{ app.profile = await store.getProfile(); }catch(_){ app.profile = null; }
  app.authChecked = true;
  if(app.screen==='landing') render();
  maybeResumeLogin();
}
function maybeResumeLogin(){ if(app.pendingLogin && app.ready && app.authChecked){ app.pendingLogin=false; goLogin(); } }
init();
</script>
