<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="AD Desk turns a screenplay into a shooting plan: script breakdown, versions, cast and location schedules, call sheets and sides for 1st assistant directors.">
<meta property="og:title" content="AD Desk · Pre-production for 1st ADs">
<meta property="og:description" content="AD Desk turns a screenplay into a shooting plan: script breakdown, versions, cast and location schedules, call sheets and sides for 1st assistant directors.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#4C5BD4">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>AD Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: production-office tool. Header + tabs, then script page beside a breakdown sheet; stripboard uses real strip colours. */
/* Layout: calm document app. Sidebar of scripts on the left, a centred document column with soft cards; script pages stay Courier, strips keep their production colours. */
:root{
  --bg:#F3F3F5; --surface:#FFFFFF; --paper:#FFFFFF; --fg:#1D1D1F; --muted:#6E6E76; --line:rgba(20,20,30,.12); --line-soft:rgba(20,20,30,.07);
  --ink:#1D1D1F; --ink-fg:#FFFFFF; --accent:#4C5BD4; --accent-fg:#FFFFFF; --accent-soft:rgba(76,91,212,.10);
  --sel:rgba(20,20,30,.045); --sel-line:#4C5BD4;
  --side:#ECECF0; --well:#F0F0F3; --btn:rgba(20,20,30,.06); --btn-hover:rgba(20,20,30,.10); --seg:rgba(20,20,30,.06);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06); --shadow-lg:0 2px 6px rgba(0,0,0,.06),0 16px 40px rgba(0,0,0,.12);
  --flag:#9A5B00; --flag-bg:#FFF3DC; --flag-line:#EDC27A; --err:#C0392B; --err-bg:#FDECEA;
  --c-cast:#D32F2F; --c-extras:#2E8B3E; --c-stunts:#D86E00; --c-props:#7B3FC4; --c-wardrobe:#3F5D7D;
  --c-makeup:#0E8585; --c-vehicles:#C92A7A; --c-sfx:#1E6FD9; --c-sound:#86592C;
  --s-intday:#FFFFFF; --s-extday:#FFF2A1; --s-intnight:#CFDFFF; --s-extnight:#CBEFD1; --s-fg:#1D1D1F; --s-line:rgba(20,20,30,.10);
  --db-bg:#1D1D1F; --db-fg:#FFFFFF;
  --f-ui:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-cond:var(--f-ui);
  --f-script:"Courier Prime", "Courier New", Courier, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1C1C1E; --surface:#2A2A2D; --paper:#262629; --fg:#F2F2F4; --muted:#9C9CA4; --line:rgba(255,255,255,.12); --line-soft:rgba(255,255,255,.07);
  --ink:#F2F2F4; --ink-fg:#1C1C1E; --accent:#8F99F5; --accent-fg:#15172E; --accent-soft:rgba(143,153,245,.16);
  --sel:rgba(255,255,255,.055); --sel-line:#8F99F5;
  --side:#232326; --well:#222225; --btn:rgba(255,255,255,.08); --btn-hover:rgba(255,255,255,.13); --seg:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28); --shadow-lg:0 2px 6px rgba(0,0,0,.35),0 18px 44px rgba(0,0,0,.45);
  --flag:#F2B04A; --flag-bg:rgba(242,176,74,.12); --flag-line:rgba(242,176,74,.40); --err:#FF8A80; --err-bg:rgba(255,138,128,.12);
  --c-cast:#FF6B66; --c-extras:#5CCB6E; --c-stunts:#FFA040; --c-props:#B48CFF; --c-wardrobe:#9DB7D3;
  --c-makeup:#4FD1C5; --c-vehicles:#FF7AB8; --c-sfx:#6FA8FF; --c-sound:#D1A274;
  --s-intday:#303034; --s-extday:#463F1C; --s-intnight:#1E2F4D; --s-extnight:#1C3D28; --s-fg:#F2F2F4; --s-line:rgba(255,255,255,.08);
  --db-bg:#0E0E10; --db-fg:#F2F2F4; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1C1C1E; --surface:#2A2A2D; --paper:#262629; --fg:#F2F2F4; --muted:#9C9CA4; --line:rgba(255,255,255,.12); --line-soft:rgba(255,255,255,.07);
  --ink:#F2F2F4; --ink-fg:#1C1C1E; --accent:#8F99F5; --accent-fg:#15172E; --accent-soft:rgba(143,153,245,.16);
  --sel:rgba(255,255,255,.055); --sel-line:#8F99F5;
  --side:#232326; --well:#222225; --btn:rgba(255,255,255,.08); --btn-hover:rgba(255,255,255,.13); --seg:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28); --shadow-lg:0 2px 6px rgba(0,0,0,.35),0 18px 44px rgba(0,0,0,.45);
  --flag:#F2B04A; --flag-bg:rgba(242,176,74,.12); --flag-line:rgba(242,176,74,.40); --err:#FF8A80; --err-bg:rgba(255,138,128,.12);
  --c-cast:#FF6B66; --c-extras:#5CCB6E; --c-stunts:#FFA040; --c-props:#B48CFF; --c-wardrobe:#9DB7D3;
  --c-makeup:#4FD1C5; --c-vehicles:#FF7AB8; --c-sfx:#6FA8FF; --c-sound:#D1A274;
  --s-intday:#303034; --s-extday:#463F1C; --s-intnight:#1E2F4D; --s-extnight:#1C3D28; --s-fg:#F2F2F4; --s-line:rgba(255,255,255,.08);
  --db-bg:#0E0E10; --db-fg:#F2F2F4; color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--sel-line);outline-offset:2px}
.app{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:16px 28px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{display:grid;grid-template-columns:repeat(4,6px);gap:2px;height:30px}
.mark i{display:block;border:1px solid var(--s-line);border-radius:1px}
.mark i:nth-child(1){background:var(--s-intday)}.mark i:nth-child(2){background:var(--s-extday)}
.mark i:nth-child(3){background:var(--s-intnight)}.mark i:nth-child(4){background:var(--s-extnight)}
.name{font-family:var(--f-cond);font-weight:700;font-size:26px;letter-spacing:.01em;line-height:1}
.sub{font-family:var(--f-script);font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;flex:1;min-width:0}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-cond);font-size:22px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat b small{font-size:13px;color:var(--flag);font-weight:600;margin-left:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.btn.primary:hover{opacity:.88}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:2px}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:10px 14px;font-family:var(--f-cond);font-size:17px;font-weight:600;letter-spacing:.02em;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.tab .count{font-family:var(--f-ui);font-size:12px;font-weight:600;margin-left:6px;color:var(--muted)}

/* notice */
.notice{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 14px;border-radius:8px;border:1px solid var(--flag-line);background:var(--flag-bg);color:var(--fg)}
.notice.err{border-color:var(--err);background:var(--err-bg)}
.notice.plain{border-color:var(--line);background:var(--surface)}
.notice p{margin:0;flex:1;min-width:220px}
.notice .row{display:flex;gap:8px;flex-wrap:wrap}
.spinner{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--fg);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}

/* script view */
.scriptView{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:40px 8% 56px;font-family:var(--f-script);font-size:15px;line-height:1.5;max-width:780px;margin:0 auto;width:100%}
.scene{margin-bottom:6px}
.seg{position:relative;padding:4px 0 2px;border-radius:3px;cursor:text}
.seg.sel{background:var(--sel);box-shadow:-10px 0 0 var(--sel),10px 0 0 var(--sel)}
.head{display:grid;grid-template-columns:3.4em minmax(0,1fr) 3.4em;align-items:baseline;font-weight:700;margin:14px -3.4em 12px;cursor:pointer}
.head .num{font-weight:700;text-align:center}
.head .num:last-child{text-align:center}
.head .ht{text-transform:uppercase;min-width:0}
.head.split .ht,.head.split .num{color:var(--flag)}
.head .undo{font-family:var(--f-ui);font-size:12px;font-weight:600;color:var(--muted);margin-left:10px;background:none;border:0;cursor:pointer;text-decoration:underline}
.chipline{display:flex;gap:6px;flex-wrap:wrap;margin:-6px 0 10px;font-family:var(--f-ui)}
.tagchip{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.el{margin:0 0 1em;position:relative}
.el.action{padding-right:4px}
.el.cue{margin:0;padding-left:37%;text-transform:uppercase}
.el.paren{margin:0 0 0 30%;max-width:40%}
.el.dialogue{margin:0 16% 1em 22%}
.el.cue + .el.dialogue,.el.paren + .el.dialogue{margin-top:0}
.el.trans{text-align:right;text-transform:uppercase}
.el.trans.ic{text-align:left}
.cut{position:absolute;left:-2.6em;top:0;width:1.9em;height:1.6em;border:1px solid transparent;background:none;border-radius:4px;cursor:pointer;opacity:0;color:var(--muted);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center}
.cut svg{width:14px;height:14px}
.el:hover .cut,.cut:focus-visible{opacity:1;border-color:var(--line);background:var(--surface)}
@media (hover:none){.cut{opacity:.45}}
mark.hl{color:inherit;border-radius:2px;padding:0 1px;background:color-mix(in srgb,var(--c) 24%,transparent);box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--c) 70%,transparent)}
mark.c-wardrobe{background:none;box-shadow:none;border:1.5px solid var(--c);border-radius:999px;padding:0 4px}
mark.c-makeup::after{content:"*";color:var(--c);font-weight:700;margin-left:1px}
.c-cast{--c:var(--c-cast)}.c-extras{--c:var(--c-extras)}.c-stunts{--c:var(--c-stunts)}.c-props{--c:var(--c-props)}
.c-wardrobe{--c:var(--c-wardrobe)}.c-makeup{--c:var(--c-makeup)}.c-vehicles{--c:var(--c-vehicles)}.c-sfx{--c:var(--c-sfx)}.c-sound{--c:var(--c-sound)}

/* split suggestion rows */
.sugg{font-family:var(--f-ui);font-size:14px;border:1px dashed var(--flag-line);background:var(--flag-bg);border-radius:6px;padding:10px 12px;margin:4px -12px 14px;display:flex;flex-direction:column;gap:8px}
.sugg .line1{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.sugg .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--flag)}
.sugg .h{font-family:var(--f-script);font-weight:700;text-transform:uppercase;word-break:break-word}
.sugg .why{color:var(--muted);font-size:13px}
.sugg .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sugg input{flex:1;min-width:200px;font-family:var(--f-script);font-size:14px;text-transform:uppercase;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--fg)}
.sugg.manual{border-color:var(--line);background:var(--surface)}
.sugg.manual .lbl{color:var(--muted)}

/* breakdown sheet */
.sheet{position:sticky;top:16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.sheetTop{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start}
.sheetTop .sn{grid-row:span 2;font-family:var(--f-cond);font-size:30px;font-weight:700;line-height:1;border:1.5px solid var(--fg);border-radius:4px;padding:4px 7px;min-width:48px;text-align:center}
.sheetTop .set{font-family:var(--f-cond);font-weight:700;font-size:18px;line-height:1.15;text-transform:uppercase;word-break:break-word}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.stripSwatch{display:inline-block;width:10px;height:10px;border:1px solid var(--s-line);vertical-align:-1px;margin-right:4px}
.sheetBody{padding:12px 16px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.syn{margin:0;font-size:14px}
.catrow{display:flex;flex-direction:column;gap:6px}
.catname{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:2px;background:var(--c);flex:none}
.dot.ring{background:none;border:1.5px solid var(--c);border-radius:50%}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:500;padding:3px 4px 3px 8px;border-radius:4px;background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.chip .id{font-family:var(--f-cond);font-weight:700;font-size:12px;color:var(--c)}
.chip button{border:0;background:none;cursor:pointer;width:18px;height:18px;border-radius:3px;color:var(--muted);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center}
.chip button:hover{background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--fg)}
.chip.auto{border-style:dashed}
.hint{font-size:13px;color:var(--muted);margin:0;padding-top:8px;border-top:1px solid var(--line-soft)}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* popover */
.pop{position:fixed;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:8px;width:min(300px,calc(100vw - 24px))}
.pop .q{font-size:12px;color:var(--muted);padding:2px 4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop .q b{color:var(--fg);font-family:var(--f-script)}
.pop .grid{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.pop button{display:flex;align-items:center;gap:7px;border:0;background:none;padding:6px 6px;border-radius:5px;cursor:pointer;font-size:13px;font-weight:500;text-align:left}
.pop button:hover,.pop button:focus-visible{background:var(--sel)}

/* breakdown table */
.tableWrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;font-weight:700;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sel)}
td.sc{font-family:var(--f-cond);font-weight:700;font-size:16px;white-space:nowrap}
td.set{font-weight:600;text-transform:uppercase;font-family:var(--f-cond);font-size:14px;min-width:170px}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.mini{display:inline-flex;align-items:center;gap:4px;margin:0 8px 3px 0;white-space:nowrap}
.mini .dot{width:7px;height:7px}
.castids{display:flex;gap:3px;flex-wrap:wrap}
.cid{font-family:var(--f-cond);font-weight:700;font-size:13px;min-width:20px;height:20px;padding:0 4px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;border:1px solid currentColor}

/* stripboard */
.boardBar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.boardBar .sp{flex:1}
.boardBar label{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.boardBar select{font:inherit;font-size:13px;padding:5px 6px;border-radius:5px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.board{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.strips{min-width:760px;display:flex;flex-direction:column}
.strip{display:grid;grid-template-columns:34px 64px 46px minmax(0,1fr) 54px 64px 240px;align-items:center;min-height:44px;color:var(--s-fg);border-bottom:1px solid var(--s-line);font-size:13px}
.strip.hdr{min-height:32px;background:var(--surface);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.strip > div{padding:6px 8px;min-width:0}
.strip.intday{background:var(--s-intday)}.strip.extday{background:var(--s-extday)}
.strip.intnight{background:var(--s-intnight)}.strip.extnight{background:var(--s-extnight)}
.strip .scn{font-family:var(--f-cond);font-weight:700;font-size:17px}
.strip .ie,.strip .dn{font-family:var(--f-cond);font-weight:600;font-size:14px}
.strip .st{display:flex;flex-direction:column}
.strip .st b{font-family:var(--f-cond);font-weight:700;font-size:15px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .st span{font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .pg{font-variant-numeric:tabular-nums;font-weight:600}
.handle{width:26px;height:30px;border:0;background:none;cursor:grab;color:inherit;opacity:.5;display:flex;align-items:center;justify-content:center;border-radius:4px}
.handle:hover{opacity:1}
.strip.dragging{opacity:.4}
.strip.over-before{box-shadow:inset 0 3px 0 var(--sel-line)}
.strip.over-after{box-shadow:inset 0 -3px 0 var(--sel-line)}
.strip.split .scn{color:var(--flag)}
:root:not([data-theme="dark"]) .strip.split .scn{color:#8A4F00}
.daybreak{background:var(--db-bg);color:var(--db-fg);display:flex;align-items:center;gap:12px;padding:8px 12px 8px 4px;min-height:38px;border-bottom:1px solid var(--s-line)}
.daybreak b{font-family:var(--f-cond);font-size:16px;letter-spacing:.04em;text-transform:uppercase}
.daybreak span{font-size:13px;opacity:.8;flex:1}
.daybreak .x{border:0;background:none;color:inherit;cursor:pointer;opacity:.7;font-size:18px;width:28px;height:28px;border-radius:4px}
.daybreak .x:hover{opacity:1}
.boardFoot{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 12px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
.boardFoot b{color:var(--fg);font-family:var(--f-cond);font-size:14px;font-weight:700}

/* modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,12,16,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.modalBox{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(720px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column;gap:12px;padding:18px}
.modalBox h2{margin:0;font-family:var(--f-cond);font-size:22px}
.modalBox p{margin:0;color:var(--muted);font-size:14px}
.modalBox textarea{width:100%;min-height:300px;flex:1;font-family:var(--f-script);font-size:13px;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--fg);resize:vertical}

.pcard .dchip{background:var(--seg)}
.dchip button{border:0;background:none;cursor:pointer;color:var(--muted);width:18px;height:18px;border-radius:4px}
.dchip button:hover{color:var(--fg);background:var(--btn)}
.dadd{width:auto;max-width:150px;color:var(--muted)}
.qchip{border:1px dashed var(--line);background:none;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--fg);cursor:pointer}
.qchip:hover{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.crewTable td{vertical-align:middle;padding:6px 8px}
.crewTable .dcell{min-width:180px}
.crewTable tbody tr{cursor:default}
.crewTable tbody tr:hover td{background:none}

/* cast & crew: inner tabs, compact cards */
.ptabs{display:inline-flex;gap:2px;padding:3px;background:var(--seg);border-radius:10px;align-self:flex-start;margin-bottom:-8px}
.ptabs button{border:0;background:none;border-radius:8px;padding:7px 16px;font:inherit;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.ptabs button:hover{color:var(--fg)}
.ptabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ptabs .count{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.psHead.row2{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ccard{display:flex;align-items:center;gap:12px;text-align:left;border:0;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;cursor:pointer;color:var(--fg);font:inherit;min-width:0}
.ccard:hover{box-shadow:0 0 0 1px var(--line),var(--shadow)}
.ccard:focus-visible,.ccard.on{outline:none;box-shadow:0 0 0 2px var(--accent)}
.avm{width:40px;height:40px;border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;background:var(--well);color:var(--muted);font-weight:700;font-size:13px;flex:none}
.avxs{width:20px;height:20px;border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;background:var(--well);color:var(--muted);font-weight:700;font-size:9px;flex:none;border-width:1px}
.ccText{display:flex;flex-direction:column;min-width:0;gap:1px}
.ccChar{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccChar em{font-style:normal;text-transform:none;font-weight:600;font-size:11px;color:var(--muted);background:var(--well);border-radius:4px;padding:1px 5px;margin-left:6px;letter-spacing:0}
.ccActor{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccMeta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.ccDot{width:7px;height:7px;border-radius:50%;background:var(--flag)}
.qrow .fl{align-self:center;margin-right:4px}
.qchip em{font-style:normal;font-weight:500;color:var(--muted);margin-left:6px}

/* person + sides side sheet */
#pside .pkBackdrop{position:fixed;inset:0;z-index:34;background:rgba(15,15,20,.18)}
.sideSheet{width:min(520px,100vw);border-left:1px solid var(--line-soft)}
.sideSheet.wide{width:min(680px,100vw)}
.ssScroll{flex:1;overflow:auto;padding:12px 20px 28px;display:flex;flex-direction:column;gap:14px}
.ssTop{display:flex;gap:14px;align-items:center}
.ssTop .actor{font-weight:500}
.ssSec{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line-soft);padding-top:14px}
.ssHead{display:flex;flex-direction:column;gap:2px}
.ssHead h3{margin:0;font-size:15px;font-weight:700}
.ifield{display:flex;flex-direction:column;gap:4px}
.ifield > span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.avList{display:flex;flex-direction:column;gap:6px}
.avRow{display:grid;grid-template-columns:84px 132px minmax(0,1fr) 28px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.avRow:last-child{border-bottom:0}
.avRow .avNote{grid-column:2 / 4}
.avRow select{font:inherit;font-size:13px;color:var(--fg);background:var(--well);border:1px solid transparent;border-radius:7px;padding:5px 6px}
.avDate{font-size:13px;font-weight:650;white-space:nowrap}
.avHours{display:inline-flex;align-items:center;gap:3px}
.avHours.dim{opacity:.35}
.avNote{font-size:13px;padding:5px 8px}
.avAddRow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.avAddRow .dadd{max-width:none;width:170px;color:var(--fg);padding:6px 8px}
.scChips{display:flex;flex-wrap:wrap;gap:4px}
.scChip{font:inherit;font-size:12px;font-weight:700;min-width:34px;padding:4px 6px;border-radius:6px;border:1px solid var(--line-soft);background:none;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
button.scChip{cursor:pointer}
button.scChip:hover{border-color:var(--accent)}
.scChip.on{background:var(--accent-soft);border-color:transparent;color:var(--fg)}
.dayLines{display:flex;flex-direction:column;gap:4px}
.dayLine{display:grid;grid-template-columns:52px 96px 92px minmax(0,1fr);gap:8px;align-items:center;text-align:left;border:0;background:var(--well);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;color:var(--fg);cursor:pointer}
.dayLine:hover{box-shadow:0 0 0 1px var(--line)}
.dayLine.bad{background:var(--err-bg)}
.dayLine .avPill{justify-self:start}

/* availability pills, cast chips */
.avPill{display:inline-flex;flex-direction:column;font-size:12px;font-weight:650;line-height:1.25;border-radius:6px;padding:3px 8px;white-space:nowrap;background:var(--well);color:var(--muted)}
.avPill small{font-weight:500;font-size:11px;opacity:.85;white-space:normal}
.avPill.part{background:var(--flag-bg);color:var(--flag)}
.avPill.off{background:var(--err-bg);color:var(--err)}
.cname.part,.cname.off{gap:4px}
.cname.part i,.cname.off i{width:6px;height:6px;border-radius:50%;background:var(--flag)}
.cname.off{box-shadow:inset 0 0 0 1px var(--err);background:var(--err-bg)}
.cname.off i{background:var(--err)}
.cname.part{box-shadow:inset 0 0 0 1px var(--flag-line)}
.pkTags .tagOff{background:var(--err-bg);color:var(--err)}
tr.clash td{background:color-mix(in srgb,var(--err-bg) 60%,transparent)}
button.who.linky{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
button.who.linky:hover b{text-decoration:underline}
.daySum{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13px;background:var(--well);border-radius:10px;padding:9px 12px;margin:0 0 12px}
.daySum.ok{color:var(--muted)}
.dsItem{display:inline-flex;align-items:center;gap:5px}
.dsItem.off b{color:var(--err)}
.dsItem.part b{color:var(--flag)}

/* sides */
.sdList{display:flex;flex-direction:column;gap:4px}
.sdRow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer}
.sdRow:hover{background:var(--well)}
.sdRow.dis{cursor:default;opacity:.8}
.sdWho{display:flex;flex-direction:column;flex:1;min-width:0;font-size:13.5px}
.sdWho small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sdLog{font-size:11.5px;font-weight:650;border-radius:5px;padding:2px 6px;background:color-mix(in srgb,var(--c-extras) 16%,transparent);white-space:nowrap}
.sdLog.scheduled{background:var(--accent-soft)}
.sdWhen{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:13.5px;padding:4px 2px}
.sdWhen label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.sdWhen input[type="datetime-local"]{font:inherit;font-size:13px;color:var(--fg);background:var(--well);border:1px solid transparent;border-radius:7px;padding:5px 7px}
.sdWhen input:disabled{opacity:.45}
.sdPages{margin:4px -20px -28px;padding:16px;flex:none;overflow:visible}
.sideScene{margin-bottom:28px}
.sideHead{display:grid;grid-template-columns:2.4em minmax(0,1fr) 2.4em;font-weight:700;text-transform:uppercase;margin:0 -1em 6px}
.sideHead .num{text-align:center;color:var(--muted)}
.sideTime{font-family:-apple-system,system-ui,sans-serif;font-size:12px;color:var(--muted);margin:-2px 0 6px}
@media (max-width:640px){ .avRow{grid-template-columns:1fr auto} .avRow .avDate{grid-column:1 / -1} .avRow .avNote{grid-column:1 / 2} .dayLine{grid-template-columns:auto auto 1fr} .dayLine .muted{display:none} }


/* breakdown filter popover */
.tableCard.bdCard{overflow:visible}
.bdCard .tableWrap{border-radius:0 0 14px 14px}
.fltWrap{position:relative}
.fltBtn{display:inline-flex;align-items:center;gap:6px}
.fltBtn.on{box-shadow:0 0 0 1.5px var(--accent);color:var(--accent)}
.fltN{background:var(--accent);color:#fff;border-radius:999px;font-size:11px;font-weight:700;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.fltPop{position:absolute;right:0;top:calc(100% + 6px);z-index:30;width:min(460px,calc(100vw - 32px));background:var(--surface);border-radius:12px;box-shadow:var(--shadow-lg);padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.fltSec{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.fltSec + .fltSec{border-top:1px solid var(--line-soft);padding-top:14px}
.fltSecHead{display:flex;justify-content:space-between;align-self:stretch}
.fltPop .locChips{margin:0}
.fltActive{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.fltTag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;background:var(--well);border-radius:999px;padding:3px 4px 3px 10px}
.fltTag button{border:0;background:none;cursor:pointer;color:var(--muted);width:20px;height:20px;border-radius:50%;font-size:14px;line-height:1}
.fltTag button:hover{background:var(--btn);color:var(--fg)}

/* ---------- landing page ---------- */
body.frontMode .shell{display:none}
:root{ --ld-bg:#FBFBFC; --ld-tint-lav:#EEEBFF; --ld-tint-peach:#FFEDE3; --ld-tint-mint:#E3F6EC; --ld-tint-sky:#E4F0FF; --ld-glow1:rgba(124,108,255,.30); --ld-glow2:rgba(255,170,120,.28); --ld-glow3:rgba(90,200,250,.22) }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ld-bg:#18181A; --ld-tint-lav:#26233D; --ld-tint-peach:#3A2A22; --ld-tint-mint:#1D3127; --ld-tint-sky:#1E2A3D; --ld-glow1:rgba(124,108,255,.28); --ld-glow2:rgba(255,150,100,.16); --ld-glow3:rgba(90,200,250,.14) } }
:root[data-theme="dark"]{ --ld-bg:#18181A; --ld-tint-lav:#26233D; --ld-tint-peach:#3A2A22; --ld-tint-mint:#1D3127; --ld-tint-sky:#1E2A3D; --ld-glow1:rgba(124,108,255,.28); --ld-glow2:rgba(255,150,100,.16); --ld-glow3:rgba(90,200,250,.14) }
body.frontMode{background:var(--ld-bg)}
.ld{min-height:100vh;background:var(--ld-bg);color:var(--fg);overflow-x:clip}
.ld button{font-family:inherit}
.ldNav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ld-bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line-soft);padding-top:env(safe-area-inset-top,0px)}
.ldNavIn{max-width:1160px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:24px}
.ldBrand{display:inline-flex;align-items:center;gap:10px;border:0;background:none;color:var(--fg);font-weight:750;font-size:17px;cursor:pointer;padding:0;letter-spacing:-.01em}
.ldBrand .mark{height:22px;grid-template-columns:repeat(4,5px)}
.ldLinks{display:flex;gap:4px;flex:1;justify-content:center}
.ldLinks button,.ldLink{border:0;background:none;color:var(--muted);font-size:14.5px;font-weight:550;padding:7px 12px;border-radius:8px;cursor:pointer}
.ldLinks button:hover,.ldLink:hover{color:var(--fg);background:var(--btn)}
.ldNavBtns{display:flex;align-items:center;gap:6px}
.ldCta{border-radius:999px;padding:8px 16px;font-size:14px}
.ldBig{border-radius:999px;padding:13px 22px;font-size:15.5px;font-weight:650;gap:8px}
.ldBig svg{width:16px;height:16px}
.btn.ghost{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:var(--well)}

.ldHero{position:relative;max-width:1160px;margin:0 auto;padding:72px 24px 40px;text-align:center;display:flex;flex-direction:column;align-items:center}
.ldGlow{position:absolute;inset:-40px 0 auto;height:620px;z-index:0;pointer-events:none;background:radial-gradient(40% 50% at 30% 30%,var(--ld-glow1),transparent 70%),radial-gradient(35% 45% at 72% 22%,var(--ld-glow2),transparent 70%),radial-gradient(40% 45% at 55% 70%,var(--ld-glow3),transparent 70%);filter:blur(10px)}
.ldHero > *:not(.ldGlow){position:relative;z-index:1}
.ldBadge{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:650;color:var(--accent);background:var(--surface);box-shadow:0 0 0 1px var(--line-soft),0 4px 14px rgba(0,0,0,.05);padding:6px 14px;border-radius:999px}
.ldHero h1{font-size:clamp(40px,6.4vw,78px);line-height:1.02;letter-spacing:-.04em;font-weight:800;margin:22px 0 0;text-wrap:balance}
.ldSub{font-size:clamp(17px,1.9vw,21px);line-height:1.45;color:var(--muted);max-width:640px;margin:20px 0 0;text-wrap:pretty}
.ldHeroBtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:30px}
.ldNote{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:14px 0 0}
.ldNote svg{width:14px;height:14px}
.ldTabs{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:52px;padding:4px;background:var(--surface);border-radius:999px;box-shadow:0 0 0 1px var(--line-soft),0 6px 18px rgba(0,0,0,.05)}
.ldTabs button{border:0;background:none;padding:8px 18px;border-radius:999px;font-size:14.5px;font-weight:600;color:var(--muted);cursor:pointer}
.ldTabs button:hover{color:var(--fg)}
.ldTabs button[aria-selected="true"]{background:var(--ink);color:var(--ink-fg)}
.ldWindow{width:100%;max-width:980px;margin-top:22px;background:var(--surface);border-radius:20px;box-shadow:0 0 0 1px var(--line-soft),0 30px 80px rgba(20,20,40,.16);overflow:hidden;text-align:left}
.ldWinBar{display:flex;align-items:center;gap:7px;padding:12px 16px;border-bottom:1px solid var(--line-soft);background:var(--well)}
.ldWinBar i{width:11px;height:11px;border-radius:50%;background:var(--line)}
.ldWinBar span{margin-left:10px;font-size:12.5px;color:var(--muted);font-weight:600}
.ldWinBody{padding:22px;min-height:360px;background:var(--bg)}
.ldWinBody.swap > *{animation:ldIn .35s ease-out}
@keyframes ldIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ .ldWinBody.swap > *{animation:none} .ldTrack{animation:none!important} }

.ldH2c{font-size:clamp(28px,3.6vw,44px);line-height:1.08;letter-spacing:-.03em;font-weight:800;text-align:center;margin:0 auto 32px;max-width:780px;text-wrap:balance;padding:0 24px}
.ldWho{padding:72px 0 40px}
.ldMarquee{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.ldTrack{display:flex;gap:14px;width:max-content;animation:ldScroll 46s linear infinite}
.ldMarquee:hover .ldTrack{animation-play-state:paused}
@keyframes ldScroll{to{transform:translateX(calc(-50% - 7px))}}
.ldRole{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:14px 18px 14px 14px;box-shadow:0 0 0 1px var(--line-soft);min-width:250px}
.ldRole b{display:block;font-size:15px}
.ldRole span:not(.ldRoleIc){font-size:13px;color:var(--muted)}
.ldRoleIc{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}

#ldFeatures{max-width:1160px;margin:0 auto;padding:40px 24px;display:flex;flex-direction:column;gap:28px}
.ldFeat{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:48px;align-items:center;padding:28px 0}
.ldFeat.flip .ldFeatText{order:2}
.ldEyebrow{font-size:13px;font-weight:750;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.ldFeat h2{font-size:clamp(28px,3.4vw,42px);line-height:1.08;letter-spacing:-.03em;font-weight:800;margin:10px 0 14px;text-wrap:balance}
.ldFeat p{font-size:17px;line-height:1.55;color:var(--muted);margin:0 0 18px;max-width:52ch}
.ldFeat ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ldFeat li{display:flex;gap:10px;align-items:flex-start;font-size:15px;font-weight:550}
.ldFeat li svg{width:18px;height:18px;flex:none;color:var(--accent);margin-top:1px}
.ldFeatArt{border-radius:28px;padding:36px;display:flex;justify-content:center}
.tLav{background:var(--ld-tint-lav)} .tPeach{background:var(--ld-tint-peach)} .tMint{background:var(--ld-tint-mint)} .tSky{background:var(--ld-tint-sky)}

.ldAlso,.ldHow,.ldFaq{max-width:1160px;margin:0 auto;padding:64px 24px}
.ldAlsoGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.ldMini{background:var(--surface);border-radius:20px;padding:22px;box-shadow:0 0 0 1px var(--line-soft);display:flex;flex-direction:column;gap:6px}
.ldMini svg{width:22px;height:22px;color:var(--accent);margin-bottom:8px}
.ldMini b{font-size:16px}
.ldMini span{font-size:14px;color:var(--muted);line-height:1.45}
.ldSteps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ldStep{background:var(--surface);border-radius:20px;padding:26px;box-shadow:0 0 0 1px var(--line-soft);display:flex;flex-direction:column;gap:8px}
.ldNum{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--ink-fg);display:flex;align-items:center;justify-content:center;font-weight:800;margin-bottom:8px}
.ldStep b{font-size:17px}
.ldStep span:last-child{color:var(--muted);font-size:14.5px;line-height:1.5}
.ldFaqList{max-width:760px;margin:0 auto;display:flex;flex-direction:column}
.ldQ{border-bottom:1px solid var(--line)}
.ldQ summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 4px;font-size:17px;font-weight:650}
.ldQ summary::-webkit-details-marker{display:none}
.ldQ summary span{position:relative;width:14px;height:14px;flex:none}
.ldQ summary span::before,.ldQ summary span::after{content:"";position:absolute;left:0;right:0;top:6px;height:2px;border-radius:2px;background:var(--muted);transition:transform .2s}
.ldQ summary span::after{transform:rotate(90deg)}
.ldQ[open] summary span::after{transform:rotate(0)}
.ldQ p{margin:0 4px 20px;color:var(--muted);font-size:15.5px;line-height:1.55;max-width:64ch}
.ldEnd{max-width:1112px;margin:24px auto 56px;border-radius:32px;padding:64px 24px;text-align:center;background:var(--ink);color:var(--ink-fg);position:relative;overflow:hidden}
.ldEnd h2{font-size:clamp(28px,4vw,48px);letter-spacing:-.03em;line-height:1.06;margin:0 auto 10px;max-width:680px;font-weight:800;text-wrap:balance}
.ldEnd p{margin:0 0 26px;opacity:.7;font-size:17px}
.ldEnd .btn.primary{background:var(--accent);color:var(--accent-fg)}
.ldFoot{max-width:1160px;margin:0 auto;padding:24px 24px 40px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13.5px;border-top:1px solid var(--line-soft)}
.ldFoot .sp{flex:1}
.ldFoot .ldBrand{font-size:15px}

/* mockups */
.mk{background:var(--surface);border-radius:14px;box-shadow:0 0 0 1px var(--line-soft),0 12px 32px rgba(20,20,40,.08);font-size:13px;color:var(--fg);width:100%;max-width:560px;overflow:hidden}
.ldWinBody .mk{max-width:none}
.mk .muted{color:var(--muted)}
.mk .sp{flex:1}
.ldDot{width:9px;height:9px;border-radius:3px;background:hsl(var(--h) 58% 52%);display:inline-block;flex:none}
.mkBar{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-soft)}
.mkBtn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;background:var(--btn);border-radius:7px;padding:5px 10px;white-space:nowrap}
.mkBtn.primary{background:var(--accent);color:var(--accent-fg)}
.mkBtn em{font-style:normal;background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;font-size:11px}
.mkRow{display:grid;grid-template-columns:34px 38px minmax(0,1.6fr) 70px 46px minmax(0,1.8fr);gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line-soft);box-shadow:inset 3px 0 0 hsl(var(--h) 58% 52%)}
.mkRow:last-child{border-bottom:0}
.mkRow b{font-size:14px}
.mkLoc{display:flex;align-items:center;gap:7px;font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mkDn{display:inline-flex;align-items:center;white-space:nowrap}
.mkCast{display:flex;flex-wrap:wrap;gap:4px}
.mkVer{padding:18px}
.mkVerHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mkPill{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:650;background:var(--well);border-radius:8px;padding:6px 10px}
.mkPill em{font-style:normal;color:var(--c-extras);font-size:10.5px;letter-spacing:.06em}
.mkVerList{display:flex;flex-direction:column;gap:4px;background:var(--well);border-radius:12px;padding:6px}
.mkVerRow{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:9px}
.mkVerRow.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.mkVerRow small{display:block;color:var(--muted);font-size:12px}
.vtagMk{font-weight:800;font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:3px 0;text-align:center}
.mkOk svg{width:16px;height:16px;color:var(--accent)}
.mkSave{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mkSave b{width:100%;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mkOpt{font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.mkOpt.on{border-color:var(--accent);background:var(--accent-soft)}
.mkPicker{padding:16px}
.mkPkTitle{display:flex;align-items:baseline;gap:10px;font-size:15px;margin-bottom:10px}
.mkSum{display:flex;flex-wrap:wrap;gap:6px 14px;background:var(--well);border-radius:10px;padding:9px 12px;margin-bottom:10px}
.mkSum > span{display:inline-flex;align-items:center;gap:6px}
.mkSum > span:first-child b{color:var(--flag)} .mkSum > span:nth-child(2) b{color:var(--err)}
.mkGrp{display:flex;align-items:center;gap:8px;padding:10px 4px 6px;border-top:1px solid var(--line-soft);font-size:12.5px}
.mkGrp:first-of-type{border-top:0}
.mkPk{display:grid;grid-template-columns:16px 24px minmax(0,1fr) 18px 30px 170px;gap:10px;align-items:center;padding:8px 4px}
.mkPk > span:nth-child(3){font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mkCb{width:15px;height:15px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--line)}
.mkCb.on{background:var(--accent);box-shadow:none}
.mkTags{display:flex;justify-content:flex-end}
.mkTags em{font-style:normal;font-size:11px;font-weight:700;border-radius:5px;padding:2px 7px;white-space:nowrap}
.mkTags .ok{background:color-mix(in srgb,var(--c-extras) 16%,transparent)}
.mkTags .warn{background:var(--flag-bg);color:var(--flag)}
.mkTags .off{background:var(--err-bg);color:var(--err)}
.mkSheet{padding:18px;display:flex;flex-direction:column;gap:12px}
.mkSheetHead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mkSheetHead h4{margin:2px 0 6px;font-size:22px;letter-spacing:-.01em}
.mkActs{display:flex;gap:6px;align-items:flex-start}
.mkTimes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mkTimes span{background:var(--well);border-radius:10px;padding:9px 11px;font-size:19px;font-weight:750}
.mkTimes small{display:block;font-size:10px;letter-spacing:.06em;color:var(--muted);font-weight:700}
.mkWarn{background:var(--flag-bg);border-radius:10px;padding:10px 12px;font-size:12.5px}
.mkWarn b{display:block;margin-bottom:2px}
.mkCastRows{display:flex;flex-direction:column;gap:6px}
.mkCastRows > div{display:grid;grid-template-columns:32px 1fr auto 50px;gap:10px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line-soft)}
.mkAv{width:30px;height:30px;font-size:10.5px}
.mkT{font-weight:650;background:var(--well);border-radius:6px;padding:3px 6px;text-align:center}
.mkPaper{max-width:520px}
.mkPaperIn{padding:24px 26px;font-family:var(--f-script);font-size:12.5px;line-height:1.55;display:flex;flex-direction:column;gap:10px}
.mkPaperIn p{margin:0}
.mkHead{font-weight:700;text-transform:uppercase;display:grid;grid-template-columns:22px 1fr 22px;margin:0 -10px!important}
.mkHead span{text-align:center;color:var(--muted)}
.mkCue{padding-left:38%;text-transform:uppercase;margin-top:4px!important}
.mkDia{padding:0 16% 0 20%;margin-top:-10px!important}
.mkLegend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:12px 18px;border-top:1px solid var(--line-soft);font-size:12px;font-weight:600}
.mkLegend span{display:inline-flex;align-items:center;gap:6px}
.mkLegend .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.mkLegend .dot.ring{border:2px solid;background:none}
.mkSugg{font-family:var(--f-ui);background:var(--surface);border-radius:12px;box-shadow:0 0 0 1.5px var(--accent),0 10px 28px rgba(76,91,212,.18);padding:12px 14px;margin:2px -8px}
.mkSuggTop{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.mkSuggTag{font-family:var(--f-ui);font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);border-radius:5px;padding:2px 6px}
.mkSugg p{color:var(--muted);font-size:12.5px;margin-bottom:10px!important}
.mkSuggBtns{display:flex;gap:6px;flex-wrap:wrap}
.mkSplitLine{display:flex;gap:10px;align-items:center;font-weight:700;text-transform:uppercase;border-top:1.5px dashed var(--accent);padding-top:10px;margin-top:2px}
.mkSplitLine span{font-family:var(--f-ui);background:var(--accent);color:var(--accent-fg);border-radius:5px;padding:1px 7px;font-size:11.5px}
.mkPerson{padding:18px;display:flex;flex-direction:column;gap:8px;max-width:500px}
.mkPersonTop{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.mkPersonTop div{display:flex;flex-direction:column}
.mkPersonTop b{font-size:15px}
.mkAvL{width:52px;height:52px;font-size:16px}
.mkSecT{font-weight:750;font-size:14px;border-top:1px solid var(--line-soft);padding-top:10px;margin-top:4px}
.mkAvRow{display:grid;grid-template-columns:80px 104px 92px minmax(0,1fr);gap:8px;align-items:center;font-size:12.5px}
.mkSel{background:var(--well);border-radius:7px;padding:5px 8px;font-weight:600}
.mkDayLine{display:grid;grid-template-columns:50px 90px 1fr;gap:8px;align-items:center;background:var(--well);border-radius:9px;padding:8px 10px}
.mkDayLine.bad{background:var(--err-bg)}
.mkDayLine .avPill{justify-self:start}
.mkMail{max-width:520px}
.mkMailHead{padding:14px 18px;border-bottom:1px solid var(--line-soft);line-height:1.8;font-size:12.5px}
.mkMailHead .muted{display:inline-block;width:56px}
.mkMailBody{padding:16px 18px;display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.5}
.mkMailBody p{margin:0}
.mkMailScene{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-family:var(--f-script);font-size:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.mkMailScene .mkHead{margin:0!important;grid-template-columns:20px 1fr}
.mkMailFoot{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--line-soft);background:var(--well);font-weight:600;font-size:12.5px;flex-wrap:wrap}
.mkRadio{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);margin-left:6px}
.mkRadio.on{box-shadow:inset 0 0 0 4px var(--accent)}

/* onboarding */
.ob{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--ld-bg)}
.obMain{display:flex;flex-direction:column;padding:20px 40px 40px;padding-top:max(20px,env(safe-area-inset-top,0px))}
.obTop{display:flex;justify-content:space-between;align-items:center}
.obSteps{list-style:none;display:flex;gap:6px;padding:0;margin:40px auto 0;width:100%;max-width:440px}
.obSteps li{flex:1;display:flex;flex-direction:column;gap:8px;font-size:12px;font-weight:650;color:var(--muted)}
.obSteps li::before{content:"";height:4px;border-radius:4px;background:var(--line)}
.obSteps li.done::before,.obSteps li.on::before{background:var(--accent)}
.obSteps li.on{color:var(--fg)}
.obSteps li span{display:none}
.obBody{width:100%;max-width:440px;margin:44px auto 0;display:flex;flex-direction:column;gap:18px}
.obBody h1{font-size:34px;line-height:1.1;letter-spacing:-.03em;margin:0;font-weight:800}
.obLead{margin:-8px 0 4px;color:var(--muted);font-size:16px;line-height:1.5}
.obAcct{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:14px 16px;box-shadow:0 0 0 1px var(--line-soft)}
.obAcct img,.obAcct .avm{width:42px;height:42px;border-radius:50%}
.obAcct div{flex:1;display:flex;flex-direction:column}
.obAcct div span{font-size:13px;color:var(--muted)}
.obAcct.warn{box-shadow:0 0 0 1px var(--flag-line)}
.obOk{width:26px;height:26px;border-radius:50%;background:color-mix(in srgb,var(--c-extras) 16%,transparent);color:var(--c-extras);display:flex;align-items:center;justify-content:center}
.obOk svg{width:15px;height:15px}
.obPerks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--muted)}
.obPerks li{display:flex;align-items:center;gap:10px}
.obPerks svg{width:16px;height:16px;color:var(--accent)}
.obBtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.obBtns .btn.primary{flex:1;justify-content:center}
.obBtns .btn:disabled{opacity:.45;cursor:not-allowed}
.obField{display:flex;flex-direction:column;gap:8px}
.obField > span{font-size:13px;font-weight:650}
.obField em{font-style:normal;color:var(--muted);font-weight:500}
.obInput{font-size:16px!important;padding:12px 14px!important;border-radius:12px!important;background:var(--surface)!important;box-shadow:0 0 0 1px var(--line)}
.obInput:focus{box-shadow:0 0 0 2px var(--accent)}
.obDate{max-width:220px}
.obChips{display:flex;flex-wrap:wrap;gap:8px}
.obChip{border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--fg);cursor:pointer}
.obChip:hover{box-shadow:inset 0 0 0 1px var(--accent)}
.obChip.on{background:var(--accent);color:var(--accent-fg);box-shadow:none}
.obChoices{display:flex;flex-direction:column;gap:10px}
.obChoice{display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;column-gap:14px;text-align:left;border:0;background:var(--surface);box-shadow:0 0 0 1px var(--line-soft);border-radius:16px;padding:16px;cursor:pointer;color:var(--fg)}
.obChoice:hover{box-shadow:0 0 0 2px var(--accent)}
.obChoice b{font-size:15.5px;align-self:end}
.obChoice > span:last-child{color:var(--muted);font-size:13.5px}
.obChIc{grid-row:1 / 3;width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.obChIc .ico{width:20px;height:20px}
.obChIc .mark{height:20px;grid-template-columns:repeat(4,4px)}
.obSkip{align-self:center}
.obSpin{display:flex;justify-content:center;padding:20px}
.obSpin .spinner{display:inline-block}
.obSide{position:relative;overflow:hidden;background:var(--ld-tint-lav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:40px;border-radius:28px;margin:16px}
.obSide .ldGlow{inset:0;height:auto}
.obCard{position:relative;z-index:1;width:min(380px,100%);background:var(--surface);border-radius:22px;box-shadow:0 30px 70px rgba(20,20,60,.18);padding:22px;display:flex;flex-direction:column;gap:18px;transform:rotate(-2deg)}
.obCardTop{display:flex;align-items:center;gap:8px;font-weight:750}
.obCardTop .mark{height:18px;grid-template-columns:repeat(4,4px)}
.obWho{display:flex;align-items:center;gap:12px}
.obWho img,.obWho .avm{width:48px;height:48px;border-radius:50%}
.obWho div{display:flex;flex-direction:column}
.obWho b{font-size:17px}
.obWho span{color:var(--accent);font-weight:650;font-size:13.5px}
.obProd{background:var(--well);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px}
.obProd b{font-size:18px;letter-spacing:-.01em}
.obStrips{display:flex;gap:6px}
.obStrips i{flex:1;height:34px;border-radius:6px;background:hsl(var(--h) 58% 60% / .55)}
.obQuote{position:relative;z-index:1;font-size:15px;color:var(--muted);font-weight:600;margin:0}
.libHi{margin:0 0 4px;font-size:13.5px;color:var(--muted);font-weight:600}
.libHi b{color:var(--fg)}
.acctWrap{position:relative}
.acctBtn{border:0;background:none;padding:6px 4px;border-radius:8px;width:100%;text-align:left;cursor:pointer;color:inherit}
.acctBtn:hover{background:var(--btn)}
.acctMenu{position:absolute;bottom:calc(100% + 6px);left:0;right:0;z-index:30;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;display:flex;flex-direction:column}
.acctMenu button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;font:inherit;font-size:13.5px;font-weight:550;color:var(--fg);cursor:pointer}
.acctMenu button:hover{background:var(--btn)}

@media (max-width:900px){
  .ldLinks{display:none}
  .ldFeat,.ldFeat.flip{grid-template-columns:1fr;gap:24px}
  .ldFeat.flip .ldFeatText{order:0}
  .ldAlsoGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ldSteps{grid-template-columns:1fr}
  .ob{grid-template-columns:1fr}
  .obSide{display:none}
}
@media (max-width:560px){
  .ldNavIn{padding:10px 16px;gap:10px}
  .ldNavBtns .ldLink{display:none}
  .ldHero{padding:44px 16px 24px}
  .ldWinBody{padding:12px;min-height:0}
  .ldFeatArt{padding:16px;border-radius:20px}
  #ldFeatures,.ldAlso,.ldHow,.ldFaq{padding-left:16px;padding-right:16px}
  .ldAlsoGrid{grid-template-columns:1fr}
  .ldEnd{margin:16px 16px 40px;border-radius:24px}
  .mkRow{grid-template-columns:26px minmax(0,1fr) 46px;row-gap:4px}
  .mkRow > span:nth-child(2),.mkRow .mkDn{display:none}
  .mkRow .mkCast{grid-column:2 / -1}
  .mkTimes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mkPk{grid-template-columns:16px 22px minmax(0,1fr) 30px}
  .mkPk .mkDn{display:none}
  .mkPk .mkTags{grid-column:3 / -1}
  .mkAvRow{grid-template-columns:1fr 1fr}
  .obMain{padding:16px}
  .obBody{margin-top:28px}
}

/* call sheets */
.sheetsLayout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}
.shList{position:sticky;top:16px;display:flex;flex-direction:column;gap:6px}
.shItem{display:grid;grid-template-columns:auto 1fr auto;gap:0 8px;text-align:left;border:0;background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05);color:var(--fg);position:relative}
.shItem:hover{box-shadow:var(--shadow)}
.shItem.on{box-shadow:0 0 0 2px var(--accent)}
.shDay{font-weight:700;font-size:14px}
.shDate{font-size:13px;color:var(--muted);grid-column:2}
.shMeta{grid-column:1 / -1;font-size:12px;color:var(--muted)}
.shWarn{position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:50%;background:var(--flag);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.shProg{font-size:12.5px;color:var(--muted);padding:8px 4px}
.shProg b{color:var(--fg)}
.callSheet{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:22px 24px;display:flex;flex-direction:column;gap:18px}
.csHead{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px}
.csTitle h2{margin:2px 0 4px;font-size:26px;font-weight:800;letter-spacing:-.01em}
.dateIn{position:relative;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;background:var(--well);border-radius:8px;padding:6px 10px;cursor:pointer}
.dateIn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.dateIn:focus-within{box-shadow:0 0 0 2px var(--accent)}
.csActions{display:flex;gap:6px;flex-wrap:wrap}
.csTimes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.bigTime{display:flex;flex-direction:column;gap:2px;background:var(--well);border-radius:12px;padding:10px 12px}
.bigTime span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.bigTime input{font:inherit;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;border:0;background:none;color:var(--fg);padding:0;width:100%}
.bigTime:focus-within{box-shadow:0 0 0 2px var(--accent)}
.csInfo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ifield{display:flex;flex-direction:column;gap:3px}
.ifield span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.csSec{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line-soft);padding-top:16px}
.csSecHead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.csSecHead h3{margin:0;font-size:15px;font-weight:700}
.csSecHead .sp{flex:1}
.csTable{min-width:680px}
.csTable td{vertical-align:middle}
.csTable tbody tr{cursor:default}
.csTable tbody tr:hover td{background:none}
.csTable tr[style*="--h"] td:nth-child(2){box-shadow:inset 3px 0 0 hsl(var(--h) var(--loc-s) var(--loc-m))}
.csTable tr.isShot td{opacity:.6}
.csTable tr.isShot td:first-child{opacity:1}
.csTable tr.isShot .locName span{text-decoration:line-through}
.csTable .locName small{text-transform:none;letter-spacing:0}
.tinyTime{width:96px}
.tRange{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tRange span{color:var(--muted)}
.csTable{min-width:780px}
.rowBtns{white-space:nowrap}
.shotBox{position:relative;display:inline-flex;cursor:pointer}
.shotBox input{position:absolute;opacity:0;width:1px;height:1px}
.shotBox span{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:inline-block;background:var(--surface)}
.shotBox input:checked + span{background:var(--c-extras);border-color:var(--c-extras);box-shadow:inset 0 0 0 3px var(--surface)}
.shotBox input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.who{display:inline-flex;align-items:center;gap:8px}
.who small{display:block;font-size:12px;color:var(--muted)}
.locList,.contacts,.advance{display:flex;flex-direction:column;gap:8px}
.locLine{display:flex;gap:10px;align-items:flex-start}
.locLine .locDot{margin-top:5px}
.contacts{flex-direction:row;flex-wrap:wrap;gap:6px 18px;font-size:13.5px}
.advance{font-size:13.5px}
.qrow{display:flex;flex-wrap:wrap;gap:6px}
.extrasLine{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.cname.ex{background:color-mix(in srgb,var(--c-extras) 14%,transparent)}
.notesArea{resize:vertical}
.pad{margin:0;padding:4px 0}
.notice.issues{background:var(--flag-bg);flex-direction:column;align-items:flex-start}
.notice.issues ul{margin:0;padding-left:18px;font-size:13.5px}
.copyBox{display:block;width:100%;min-height:140px;margin-top:8px;font:12.5px/1.5 var(--f-script);background:var(--well);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px}
.tr.gone td{color:var(--muted)}
/* scene picker */
.pickerBox{width:min(820px,100%);max-height:calc(100% - 32px)}
.pkList{overflow:auto;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;padding-right:4px}
.pkGHead{display:flex;align-items:center;gap:8px;padding:4px 0}
.pkRow{display:grid;grid-template-columns:20px 44px minmax(0,1fr) 40px 44px 180px;gap:10px;align-items:center;padding:8px;border-radius:8px;cursor:pointer;font-size:13.5px}
.pkGroup + .pkGroup{border-top:1px solid var(--line);padding-top:12px}
.pkList{gap:14px}
.pkRow:hover{background:var(--sel)}
.pkRow.dis{opacity:.55;cursor:default}
.pkRow .sc{font-weight:700}

.pkSet small{display:block;text-transform:none;font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pkTags em{font-style:normal;font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--well);color:var(--muted);white-space:nowrap}
.pkTags .tagOk{background:color-mix(in srgb,var(--c-extras) 16%,transparent);color:var(--fg)}
.pkTags .tagWarn{background:var(--flag-bg);color:var(--flag)}
/* shot status elsewhere */
.shotChip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:color-mix(in srgb,var(--c-extras) 16%,transparent);color:var(--c-extras);white-space:nowrap}
.dayChip{display:inline-flex;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--well);color:var(--muted);white-space:nowrap}
tr.locRow.shotRow td:not(:first-child){opacity:.55}
.scCell{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
@media (max-width:900px){ .sheetsLayout{grid-template-columns:minmax(0,1fr)} .shList{position:static} .csTimes{grid-template-columns:repeat(2,minmax(0,1fr))} .csInfo{grid-template-columns:1fr 1fr} }

<div id="front" hidden></div>
<div class="shell">
  <aside class="side" id="side" aria-label="Scripts"></aside>
  <div class="mainCol"><div class="app">
    <header class="top" id="top"></header>
    <section class="bar" id="bar"></section>
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <div id="notice"></div>
    <main id="view"></main>
  </div></div>
</div>

<div class="pop" id="pop" hidden></div>
<div id="peek" hidden></div>
<div id="pickerHost"></div>
<div id="pside" hidden></div>
<div class="modal" id="chooser" hidden data-act="close-chooser">
  <div class="modalBox chooserBox" role="dialog" aria-modal="true" aria-labelledby="chTitle">
    <h2 id="chTitle">New script</h2>
    <p>How do you want to start?</p>
    <div class="choices">
      <button class="choice" data-act="write-script"><span class="chIco"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 2.5l3 3L6 13H3v-3z"/><path d="M9 4l3 3"/></svg></span><b>Write a script</b><small>Start from a blank page in screenplay format.</small></button>
      <button class="choice" data-act="upload-script"><span class="chIco"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10.5V2.5M5 5.5l3-3 3 3"/><path d="M2.5 10v3.5h11V10"/></svg></span><b>Upload a script</b><small>Paste it or open a .txt / .fountain file to break it down.</small></button>
    </div>
    <div class="row"><span class="sp"></span><button class="btn" data-act="close-chooser">Cancel</button></div>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modalBox" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle">New script</h2>
    <p id="mDesc"></p>
    <label class="field" id="titleField">Title<input id="titleInput" placeholder="Taken from the script's title page if left empty"></label>
    <label class="field" id="authorField">Written by<input id="authorInput" placeholder="Your name"></label>
    <textarea id="scriptInput" spellcheck="false" aria-label="Script text"></textarea>
    <label class="field" id="noteField">What changed?<input id="noteInput" placeholder="For example: director moved the wedding to night"></label>
    <p class="err" id="mErr" hidden></p>
    <div class="row">
      <label class="filelbl" id="fileLbl">Open file…<input type="file" id="fileInput" accept=".txt,.fountain,text/plain"></label>

      <span class="sp"></span>
      <button class="btn" data-act="close-modal">Cancel</button>
      <button class="btn primary" data-act="modal-save" id="mSave">Create script</button>
    </div>
  </div>
</div>
